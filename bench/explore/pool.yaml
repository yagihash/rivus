# The pool of the occasional exploration (bench/explore/README.md): big codebases that are NOT in the gate.
# Each run takes one target that has not been run (or the one run the longest ago) and the target of the last run again.
# Fields: name, url, commit (a full SHA: fixed when the target is first taken; "~" until then), lang, size (measured:
# functions, own packages, with the date; "unmeasured" until a run), last_run (date of the last exploration and the section
# of bench/explore/LOG.md; "never"), note (why it is in the pool: the shape that it may show; never a finding).
# Rules: the commit of a run is written here BEFORE the run. A target whose run showed a shape of scale is not "done":
# the shape is reduced to a go-scale profile or a corpus of the layer C (bench/README.md), and its row here says which.
targets:
  - name: memos
    url: https://github.com/usememos/memos
    commit: "~"
    lang: go
    size: "21,808 functions, 31 own packages (2026-11-21); about 985,000 summary elements in 3 passes"
    last_run: "2026-11-21, LOG.md Measurement 2"
    note: "the cause of the 985,000 elements is not known (the stack of middleware of an SDK is not it: go-scale middleware). Kept out of the gate until it is."
  - name: cloudreve
    url: https://github.com/cloudreve/cloudreve
    commit: "~"
    lang: go
    size: "44,396 functions, 105 own packages (2026-11-21)"
    last_run: "2026-11-21, LOG.md Measurement 2"
    note: "many reflection and dynamic-dispatch uncertainties (ent, an ORM of generated code)."
  - name: ech0
    url: https://github.com/lin-snow/Ech0
    commit: cecc2c19b590df85d79ea98457faa143130cd620
    lang: go
    size: "unmeasured; does not converge in 900 s (bench/README.md, ech0)"
    last_run: "never (run it with bench/compare.sh --big ech0=https://github.com/lin-snow/Ech0@cecc2c19b590df85d79ea98457faa143130cd620)"
    note: "does not converge: the case that a profile of go-scale should come from."
  - name: pocketbase
    url: https://github.com/pocketbase/pocketbase
    commit: 7f2773ec234b62d0b80ca47c508397cb3d0da3ea
    lang: go
    size: unmeasured
    last_run: never
    note: "a framework with its own router, an ORM (dbx) and a JS engine (goja): dynamic dispatch through a big interface."
  - name: caddy
