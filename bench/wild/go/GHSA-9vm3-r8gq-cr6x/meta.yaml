fix_kind: "(ii) validate and reject: UploadFileSafe returns an error when the path contains two dots, before anything is stored. The data still flows to the sink after the check"
fixed_version_expectation: "(ii): the finding may stay; the guard should be in the evidence"
summary: "The file name chosen by the client in an upload request is used as the path under the storage directory of the local file system provider, so a path with .. writes a file outside it (arbitrary file write). The fix rejects a name that contains two dots."
