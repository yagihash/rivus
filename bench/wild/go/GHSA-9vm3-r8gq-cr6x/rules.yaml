# The input of the test (not what is evaluated): the source of this checkout (the controller type that embeds
# beego.Controller, and the getters of beego that read the request). The sinks are the built-in ones (os.MkdirAll, os.Create).
# The question is whether rivus builds the real path (source -> the functions on the way -> sink) when it is given these.
ruleset: bench/wild/casdoor@1

sources:
  - kind: param_type
    type: "*github.com/casdoor/casdoor/controllers.ApiController"
    labels: [user_input]

propagators:
  - symbol: (*github.com/astaxie/beego.Controller).Input
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/astaxie/beego.Controller).GetString
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/astaxie/beego.Controller).GetFile
    flows: [{from: recv, to: result0}]
