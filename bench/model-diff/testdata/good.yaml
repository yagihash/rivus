ruleset: test/synth@1
propagators:
  - symbol: example.com/synth.Join
    flows: [{from: args, to: result}]
  - symbol: example.com/synth.Upper
    flows: [{from: arg0, to: result}]
  - symbol: example.com/synth.Copy
    flows: [{from: arg1, to: arg0}]
  - symbol: example.com/synth.Split
    flows: [{from: arg0, to: result0}, {from: arg0, to: result1}]
  - symbol: example.com/synth.NewBox
    flows: [{from: arg0, to: result}]
  - symbol: (*example.com/synth.Box).Set
    flows: [{from: arg0, to: recv}]
  - symbol: (*example.com/synth.Box).Get
    flows: [{from: recv, to: result}]
  - symbol: example.com/synth.Apply
    flows: [{from: arg1, to: result}]
  - symbol: example.com/synth.Map
    flows: [{from: arg0, to: result}]
sinks:
  - symbol: example.com/synth.Run
    args: [0]
    category: command_injection
  - symbol: example.com/synth.Query
    args: [0]
    category: sql_injection
  - symbol: example.com/synth.Open
    parts:
      - {arg: 0, field: URL}
    category: ssrf
