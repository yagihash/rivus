ruleset: rivus/rust/actix-web@1
verified_versions:
  - package: actix-web
    versions: ">=4.0.0 <5.0.0"
    checked_with: 4.20.0
    checked: 2026-11-23
sources:
  - kind: param_type
    type: "&actix_web::HttpRequest"
    labels: [user_input]
  - kind: param_type
    type: "actix_web::web::Json"
    labels: [user_input]
  - kind: field
    field: actix_web::x::Y.z
    labels: [user_input]
  - kind: call_result
    symbol: other_crate::f
    labels: [user_input]
sinks:
  - symbol: actix_web::HttpRequest::path
propagators:
  - symbol: actix_web::request::HttpRequest::uri
    flows: [{from: args, to: result}]
  - symbol: "actix_web::web::Query<T>::into_inner"
    flows: [{from: args, to: result}]
