# A package of the Rust zoo (docs/DESIGN-package-models.md, 6.8): the crate of the cells of the package axum. Nothing is fetched:
# every dependency is a path (the skeleton of axum in skel/ has no code of the crate axum).
[package]
name = "zoo-pkg-axum"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "cells/src/lib.rs"

[dependencies]
zoo-mark = { path = "../../zoo-rust/zoo-mark" }
axum = { path = "skel" }

[workspace]
