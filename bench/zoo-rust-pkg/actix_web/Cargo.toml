# A package of the Rust zoo (docs/DESIGN-package-models.md, 6.8): cells for the built-in model of actix-web. The crate
# actix-web is a skeleton in skel/ (public signatures of 4.x, bodies that only keep what they are given): nothing is fetched,
# every dependency is a path. The tests copy zoo-mark next to the crate for the extractor.
[package]
name = "zoo-pkg-actix-web"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "cells/src/lib.rs"

[dependencies]
zoo-mark = { path = "../../zoo-rust/zoo-mark" }
actix-web = { path = "skel" }

[workspace]
