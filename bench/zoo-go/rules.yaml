# Rules of the Go zoo (docs/DESIGN-zoo.md). The sources, sinks and sanitizers are the
# functions of zoo/mark, which have empty bodies for the analysis: the meaning is given
# here, with the public rules and nothing else. The built-in rules are in force as always.
ruleset: rivus/bench-zoo-go@1

sources:
  - symbol: zoo/mark.Src
    labels: [user_input]
  - symbol: zoo/mark.SrcB
    labels: [user_input]
  - symbol: zoo/mark.SrcBytes
    labels: [user_input]
  # a source that is the type of a parameter: the handler under test takes a mark.In
  - kind: param_type
    type: zoo/mark.In
    labels: [user_input]
  # the function that is given to the router: the segment of the path that the router hands to it is user input
  - kind: callback_param
    symbol: (*zoodep.Router).Get
    operand: 1
    from: 1
    labels: [user_input]

sinks:
  - symbol: zoo/mark.SinkCmd
    args: [0]
    category: command_injection
  - symbol: zoo/mark.SinkCmdB
    args: [0]
    category: command_injection
  - symbol: zoo/mark.SinkCmdBytes
    args: [0]
    category: command_injection
  - symbol: zoo/mark.SinkSQL
    args: [0]
    category: sql_injection
  - symbol: zoo/mark.SinkHTML
    args: [0]
    category: xss
  - symbol: zoo/mark.SinkPath
    args: [1]
    category: path_traversal
  - symbol: zoo/mark.SinkAny
    args: [0]
    category: command_injection
  # the sinks that read a part of a structure (docs/DESIGN-field-sinks.md)
  - symbol: zoo/mark.SinkStmt
    args: [0]
    field: SQL
    category: sql_injection
  - symbol: zoo/mark.SinkStmtAny
    args: [0]
    field: SQL
    category: sql_injection
  - symbol: zoo/mark.SinkTask
    args: [0]
    field: Task.MessageType.HTTPRequest.URL
    category: command_injection

# A mark sanitizer replaces every character of the set of its own class and does nothing else (bench/zoo/spec.json): it neutralises the
# sinks of that class and no others (ADR-115).
sanitizers:
  - symbol: zoo/mark.CleanCmd
    drops: [user_input]
    adds: [cleaned_cmd]
    neutralises: [command_injection]
  - symbol: zoo/mark.CleanSQL
    drops: [user_input]
    adds: [cleaned_sql]
    neutralises: [sql_injection]
  - symbol: zoo/mark.CleanHTML
    drops: [user_input]
    adds: [cleaned_html]
    neutralises: [xss]
  - symbol: zoo/mark.CleanPath
    drops: [user_input]
    adds: [cleaned_path]
    neutralises: [path_traversal]
  - symbol: zoo/mark.CleanURL
    drops: [user_input]
    adds: [cleaned_url]
    neutralises: [ssrf, open_redirect]
  - symbol: zoo/mark.CleanResource
    drops: [user_input]
    adds: [cleaned_resource]
    neutralises: [resource_name]
  # an interface method of a cell that says its result is clean (cells/dyn/sanitizer_own_impl)
  - symbol: (zoo/cells/dyn/sanitizer_own_impl.Cleaner).Clean
    drops: [user_input]
