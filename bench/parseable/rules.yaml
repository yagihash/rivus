# Rules for parseable (the project's own: what an actix-web handler is given, and the
# operations the project treats as dangerous; actix-web is built in now, and its rows here are the
# ones the results were measured with). Used with
#   rivus analyze -rules bench/parseable/rules.yaml
# (the Rust extractor writes the types of the extractors without their parameters).
ruleset: project/parseable@1

sources:
  # what actix-web hands to a handler: the request, and the parts of it that were parsed
  - kind: param_type
    type: "actix_web::HttpRequest"
    labels: [user_input]
  - kind: param_type
    type: "actix_web::web::Query"
    labels: [user_input]
  - kind: param_type
    type: "actix_web::web::Json"
    labels: [user_input]
  - kind: param_type
    type: "actix_web::web::Path"
    labels: [user_input]
  - kind: param_type
    type: "actix_web::web::Bytes"
    labels: [user_input]
  - kind: param_type
    type: "&actix_web::HttpRequest"
    labels: [user_input]
  - kind: param_type
    type: "actix_web::web::Form"
    labels: [user_input]

sinks:
  # the Location header of a response: an open redirect
  - symbol: actix_web::HttpResponseBuilder::insert_header
    args: [1]
    category: open_redirect
  # the address the alert targets post to
  - symbol: reqwest::Client::post
    args: [1]
    category: ssrf
  - symbol: reqwest::Client::get
    args: [1]
    category: ssrf
  # the files of the local storage
  - symbol: tokio::fs::write
    args: [0]
    category: path_traversal
  - symbol: tokio::fs::remove_file
    args: [0]
    category: path_traversal
  - symbol: tokio::fs::remove_dir_all
    args: [0]
    category: path_traversal
  - symbol: tokio::fs::create_dir_all
    args: [0]
    category: path_traversal
  - symbol: tokio::fs::read_dir
    args: [0]
    category: path_traversal

# the models of the actix-web getters (the same as the ones of internal/model/builtin/rust-actix-web.yaml,
# which was examples/rules/rust-actix-web.yaml when the results were measured)
propagators:
  - symbol: actix_web::HttpRequest::query_string
    flows: [{from: args, to: result}]
  - symbol: actix_web::HttpRequest::path
    flows: [{from: args, to: result}]
  - symbol: actix_web::HttpRequest::uri
    flows: [{from: args, to: result}]
  - symbol: actix_web::HttpRequest::headers
    flows: [{from: args, to: result}]
  - symbol: actix_web::HttpRequest::match_info
    flows: [{from: args, to: result}]
  - symbol: actix_web::HttpRequest::cookie
    flows: [{from: args, to: result}]
  - symbol: actix_web::HttpRequest::cookies
    flows: [{from: args, to: result}]
  - symbol: actix_web::HttpRequest::peer_addr
    flows: [{from: args, to: result}]
  - symbol: actix_web::HttpRequest::connection_info
    flows: [{from: args, to: result}]
  - symbol: actix_web::web::Query::into_inner
    flows: [{from: args, to: result}]
  - symbol: actix_web::web::Path::into_inner
    flows: [{from: args, to: result}]
  - symbol: actix_web::web::Json::into_inner
    flows: [{from: args, to: result}]
  - symbol: actix_web::web::Form::into_inner
    flows: [{from: args, to: result}]
