    labels: [user_input]
  - kind: param_type
    type: "gogs.io/gogs/internal/form.Webhook"
    labels: [user_input]

sinks:
  # git-module reads and writes the hook file inside the dependency: sinks in
  # dependencies are not looked for, so the call is the sink.
  - symbol: (*github.com/gogs/git-module.Repository).Hook
    args: [1]
    category: path_traversal
