# Rules of the open-world fixture of the narrowing of the candidates of a closure call (docs/DESIGN-capture.md).
ruleset: rivus/bench-rust-curated-ffi@1

sources:
  - symbol: curated_ffi::source
    labels: [user_input]

sinks:
  - symbol: curated_ffi::sink
    category: test
    accepts: [user_input]
