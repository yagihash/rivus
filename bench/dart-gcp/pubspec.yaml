name: gcp_bench
description: A small synthetic gRPC server that calls Google Cloud client packages, to measure the analysis of a project with its dependencies.
publish_to: none
environment:
  sdk: ^3.10.0
# The versions of grpc, protobuf, http2 and what they import are those of ../dart-grpc/pubspec.lock. The Google Cloud packages are locked in pubspec.lock.
dependencies:
  async: ^2.13.1
  fixnum: ^1.1.1
  gcloud: ^0.9.0
  google_cloud_storage: any
  google_cloud_protobuf: any
  googleapis: ^15.0.0
  googleapis_auth: ^2.3.5
  grpc: 5.2.0
  http: ^1.6.0
  http2: ^2.3.1
  protobuf: ^6.1.0
