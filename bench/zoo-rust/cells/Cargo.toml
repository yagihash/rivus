[package]
name = "zoo-cells"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
zoo-mark = { path = "../zoo-mark" }
# a dependency of the cells: a crate of its own, outside the workspace (the cell dyn/through-dependency)
zoo-dep = { path = "../dep" }

# code that only the harness builds (the cell rust/cfg-feature: R-17, a feature that is not a default one)
[features]
extra = []
