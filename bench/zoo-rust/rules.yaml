# Rules of the Rust zoo (docs/DESIGN-zoo.md). The sources, sinks and sanitizers are the functions of the crate
# zoo-mark, which have empty bodies for the analysis: the meaning is given here, with the public rules and nothing
# else. The built-in rules are in force as always.
ruleset: rivus/bench-zoo-rust@1

sources:
  - symbol: zoo_mark::src
    labels: [user_input]
  - symbol: zoo_mark::src_bytes
    labels: [user_input]
  # a source that is the type of a parameter: the handler under test takes an In
  - kind: param_type
    type: zoo_mark::In
    labels: [user_input]

sinks:
  - symbol: zoo_mark::sink_cmd
    args: [0]
    category: command_injection
  - symbol: zoo_mark::sink_cmd_own
    args: [0]
    category: command_injection
  - symbol: zoo_mark::sink_cmd_bytes
    args: [0]
    category: command_injection
  - symbol: zoo_mark::sink_sql
    args: [0]
    category: sql_injection
  - symbol: zoo_mark::sink_html
    args: [0]
    category: xss
  - symbol: zoo_mark::sink_path
    args: [1]
    category: path_traversal
  - symbol: zoo_mark::sink_any
    args: [0]
    category: command_injection
  # the sinks that read a part of a structure (docs/DESIGN-field-sinks.md)
  - symbol: zoo_mark::sink_stmt
    args: [0]
    field: sql
    category: sql_injection
  - symbol: zoo_mark::sink_stmt_any
    args: [0]
    field: sql
    category: sql_injection
  - symbol: zoo_mark::sink_task
    args: [0]
    field: task.message_type.http_request.0.url
    category: command_injection

# A mark sanitizer replaces every character of the set of its own class and does nothing else (bench/zoo/spec.json): it neutralises the
# sinks of that class and no others (ADR-115).
sanitizers:
  - symbol: zoo_mark::clean_cmd
    drops: [user_input]
    adds: [cleaned_cmd]
    neutralises: [command_injection]
  - symbol: zoo_mark::clean_sql
    drops: [user_input]
    adds: [cleaned_sql]
    neutralises: [sql_injection]
  - symbol: zoo_mark::clean_html
    drops: [user_input]
    adds: [cleaned_html]
    neutralises: [xss]
  - symbol: zoo_mark::clean_path
    drops: [user_input]
    adds: [cleaned_path]
    neutralises: [path_traversal]
  # a trait method of a cell that says its result is clean (cells/dyns/sanitizer_own_impl)
  - symbol: zoo_cells::dyns::sanitizer_own_impl::Cleaner::clean
    drops: [user_input]
