# Rules of the curated Rust benchmark: the source and the sink are plain
# functions (as in the sample of the extractor), so that what is measured is how
# the value goes through closures, callbacks and function values, not the rules.
ruleset: rivus/bench-rust-curated@1

sources:
  - symbol: curated::source
    labels: [user_input]

sinks:
  - symbol: curated::sink
    category: test
    accepts: [user_input]

# a trait of the crate that a model describes (the receiver goes to the result), without `read_impls`:
# the implementations of the crate are not read (src/modelled.rs)
propagators:
  - symbol: curated::modelled::Render::render
    flows: [{from: recv, to: result}]
  - symbol: curated::modelled::Mask::mask
    flows: [{from: recv, to: result}]
