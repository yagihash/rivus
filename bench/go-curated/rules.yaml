# Rules of the curated Go benchmark. The framework (web), the ORM (orm) and the
# command helper (sys) are small copies of what Gitea, gogs and gin-vue-admin
# use; the rules name them the way the rules for the real ones do.
ruleset: rivus/bench-go-curated@1

sources:
  - symbol: (*curated/web.Context).Query
    labels: [user_input]
  - symbol: (*curated/web.Context).Param
    labels: [user_input]
  - symbol: (*curated/web.Context).PostForm
    labels: [user_input]
  - symbol: (*curated/web.Context).GetHeader
    labels: [user_input]
  # the binders fill their argument, as ShouldBindJSON does
  - symbol: (*curated/web.Context).Bind
    out: [0]
    labels: [user_input]

  # the shapes of the Gitea CVEs (gitea/): the handlers take the context by its type,
  # what the OAuth2 library says about the user is a source, as in bench/gitea/rules.yaml
  - kind: param_type
    type: "*curated/gitea/context.Context"
    labels: [user_input]
  - kind: param_type
    type: "curated/gitea/goth.User"
    labels: [user_input]

sinks:
  - symbol: (curated/gitea/storage.ObjectStorage).Delete
    args: [0]
    category: path_traversal
  - symbol: (curated/gitea/storage.ObjectStorage).Open
    args: [0]
    category: path_traversal
  - symbol: (curated/gitea/storage.ObjectStorage).Save
    args: [0]
    category: path_traversal
  # gogs/git-module: the hook file is read in the dependency, so the call is the sink
  - symbol: (*curated/ext/gitmodule.Repository).Hook
    args: [1]
    category: path_traversal
  # a dependency: the entry point is the sink
  - symbol: curated/ext/openidgo.Verify
    args: [0]
    category: ssrf
  - symbol: (*curated/orm.DB).Exec
    args: [0]
    category: sql_injection
  - symbol: (*curated/orm.DB).Where
    args: [0]
    category: sql_injection
  - symbol: curated/sys.Run
    category: command_injection
  - symbol: (*curated/web.Context).Redirect
    category: open_redirect
  - symbol: (*curated/web.Context).HTML
    category: xss

sanitizers:
  - symbol: curated/valid.Ident
    drops: [user_input]
  - symbol: curated/valid.Quote
    drops: [user_input]
