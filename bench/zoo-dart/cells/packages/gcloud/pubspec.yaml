name: gcloud
description: "The skeleton of package:gcloud that the cells of the Dart zoo need (the real package is not in the zoo): the shape of the Storage and the Pub/Sub API, so that the built-in rows of package:gcloud are the ones the cells hit."
publish_to: none
environment:
  sdk: ^3.10.0
dependencies:
  zoo_mark:
    path: ../zoo_mark
