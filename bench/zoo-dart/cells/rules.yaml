# Rules of the Dart zoo (docs/DESIGN-zoo.md). The sources, sinks and sanitizers are the functions of
# package:zoo_mark, which have empty bodies for the analysis: the meaning is given here, with the
# public rules and nothing else. The built-in rules are in force as always.
ruleset: rivus/bench-zoo-dart@1

sources:
  - symbol: package:zoo_mark/zoo_mark.dart#src
    labels: [user_input]
  # what Flutter gives to an app (the skeleton of packages/zoo_flutter): a field that is read, the parameter of the
  # method that an app overrides, the arguments of a route
  - symbol: package:zoo_flutter/zoo_flutter.dart#TextEditingController.text
    labels: [user_input]
  - kind: field
    field: package:zoo_flutter/zoo_flutter.dart#RouteSettings.arguments
    labels: [user_input]
  # the parameter of the method that an app overrides: the handlers of the cells (the rule of an interface, match:
  # implementations or extends, does not fire for Dart yet, so each override is named)
  - kind: param
    symbol: package:zoo_cells/dart/flutter_override_arg.dart#OpenHandler.onMethodCall
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: package:zoo_cells/dart/flutter_override_arg.dart#OpenHandlerFixed.onMethodCall
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: package:zoo_cells/dart/flutter_override_arg.dart#OpenHandlerDecoy.onMethodCall
    params: [0]
    labels: [user_input]
  # the parameters after the request of the function that is given to the router (callback_param: the function is
  # found where the route is registered; the segments of the path are what the router hands to it)
  - kind: callback_param
    symbol: package:zoo_router/zoo_router.dart#ZooRouter.get
    operand: 1
    from: 1
    labels: [user_input]
  # a source that is the type of a parameter: the handler under test takes an In
  - kind: param_type
    type: package:zoo_mark/zoo_mark.dart#In
    labels: [user_input]

sinks:
  - symbol: package:zoo_mark/zoo_mark.dart#sinkCmd
    args: [0]
    category: command_injection
  - symbol: package:zoo_mark/zoo_mark.dart#sinkCmdBytes
    args: [0]
    category: command_injection
  - symbol: package:zoo_mark/zoo_mark.dart#sinkSql
    args: [0]
    category: sql_injection
  - symbol: package:zoo_mark/zoo_mark.dart#sinkHtml
    args: [0]
    category: xss
  - symbol: package:zoo_mark/zoo_mark.dart#sinkPath
    args: [1]
    category: path_traversal
  - symbol: package:zoo_mark/zoo_mark.dart#sinkAny
    args: [0]
    category: command_injection
  # the sinks that read a part of a structure (docs/DESIGN-field-sinks.md)
  - symbol: package:zoo_mark/zoo_mark.dart#sinkStmt
    args: [0]
    field: sql
    category: sql_injection
  - symbol: package:zoo_mark/zoo_mark.dart#sinkStmtAny
    args: [0]
    field: sql
    category: sql_injection
  - symbol: package:zoo_mark/zoo_mark.dart#sinkTask
    args: [0]
    field: task.message.httpRequest.url
    category: command_injection

# A mark sanitizer replaces every character of the set of its own class and does nothing else (bench/zoo/spec.json): it neutralises the
# sinks of that class and no others (ADR-115).
sanitizers:
  - symbol: package:zoo_mark/zoo_mark.dart#cleanCmd
    drops: [user_input]
    adds: [cleaned_cmd]
    neutralises: [command_injection]
  - symbol: package:zoo_mark/zoo_mark.dart#cleanSql
    drops: [user_input]
    adds: [cleaned_sql]
    neutralises: [sql_injection]
  - symbol: package:zoo_mark/zoo_mark.dart#cleanHtml
    drops: [user_input]
    adds: [cleaned_html]
    neutralises: [xss]
  - symbol: package:zoo_mark/zoo_mark.dart#cleanPath
    drops: [user_input]
    adds: [cleaned_path]
    neutralises: [path_traversal]
  - symbol: package:zoo_mark/zoo_mark.dart#cleanAll
    drops: [user_input]
    adds: [cleaned_all]
    neutralises: [command_injection, sql_injection, xss, path_traversal, resource_name, ssrf, open_redirect]
  # an interface method of a cell that says its result is clean (cells/lib/dyn/sanitizer_own_impl)
  - symbol: package:zoo_cells/dyn/sanitizer_own_impl.dart#Cleaner.clean
    drops: [user_input]
