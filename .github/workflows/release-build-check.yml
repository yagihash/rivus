name: release-build-check

# リリースのアーカイブ（tagpr.yml の release-binaries が、タグのときだけ作る）が、いま作れることを、PR で確かめる。
# とくに、依存が増えたときに、ライセンス文のないモジュールがあると、リリースのときに初めて失敗する。それを先に見つける。
on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - scripts/build-release-archives.sh
      - .github/workflows/release-build-check.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: scripts/build-release-archives.sh 0.0.0-check
