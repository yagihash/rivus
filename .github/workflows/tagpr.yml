name: tagpr

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tagpr
  cancel-in-progress: false

jobs:
  # リリース PR を作る・更新する。マージされたら、タグと GitHub Release を作る。
  # CHANGELOG.md は、tagpr がリリース PR の中で更新する（.tagpr の changelog = true）。
  #
  # トークンは、実行ごとに使い分ける（tagpr は、渡されたトークンを 1 つ使うだけ。選ぶのは、このワークフロー）。
  #   - リリース PR を作る・更新する実行（ふつうの push）: このワークフローの GITHUB_TOKEN。
  #     GITHUB_TOKEN で作った・更新した PR の CI は、承認待ちで止まる（書き込みの権限を持つ人が
  #     "Approve workflows to run" を押すと実行される）。リリース PR は main へのマージのたびに更新されるので、
  #     そのたびに全部のテストを実行すると、ほかの PR とジョブを取り合う。リリースするときに承認して、
  #     そこで初めて全部のテストを実行する。ci-ok は必須のチェックなので、成功するまでマージできない。
  #   - タグと Release を作る実行（リリース PR がマージされた直後の push）: ghmint のトークン
  #     （rivus/.github/ghmint/tagpr.rego）。v* のタグを作れるのは、tag の ruleset の例外に入っている
  #     このアプリだけ。GITHUB_TOKEN では作れない。
  # 判定を誤って GITHUB_TOKEN でタグを作ろうとした場合は、ruleset に拒否されて、この実行が失敗する
  # （手動で実行し直す。workflow_dispatch でも、main の先頭がリリース PR のマージなら、同じ判定になる）。
  # コミットは tagpr が API で作るので、どちらのトークンでも GitHub の署名が付く（main の ruleset は署名を必須にしている）。
  # リポジトリの設定 "Allow GitHub Actions to create and approve pull requests" が必要。
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # ghmint（タグと Release を作る実行だけ）
      contents: write # リリース PR のブランチ（GITHUB_TOKEN の実行）
      pull-requests: write # リリース PR の作成と更新、ラベル（GITHUB_TOKEN の実行）
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      # このコミットが、tagpr のリリース PR（ブランチ tagpr-from-*、ラベル tagpr）のマージか。
      # tagpr 自身の判定（マージ済みのリリース PR があれば、タグを打つ）と同じものを、先に見る。
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("tagpr-from-")) and ([.labels[].name] | index("tagpr")))] | length')
          if [ "$n" -gt 0 ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi
          echo "release PR merged at this commit: $n"
      - id: token
        if: steps.mode.outputs.release == 'true'
        uses: yagihash/ghmint-action@be57533eef7f69550d06f0c93eede5589158281a # v1.0.0
        with:
          scope: yagihash/rivus
          policy: tagpr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token || github.token }}
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token || github.token }}

  # タグが打たれたときだけ、Go のバイナリ（linux/amd64, linux/arm64, darwin/arm64）をビルドして、tagpr が draft で作った
  # Release に載せてから公開する。Dart と Rust の extractor は載せない（使う側でビルドする）。
  # immutable releases なので、公開した後はアセットを足せない・差し替えられない。だから、全部のアセットを draft に載せてから、
  # 最後に 1 回だけ公開する。途中で失敗したら Release は draft のまま残るので、直してこのワークフローを手動で実行し直す
  # （workflow_dispatch。main の先頭がリリース PR のマージなら、tagpr は既存のタグと draft をそのまま使う）。
  # 検証できるものは 2 つ:
  #   - ビルド来歴（actions/attest-build-provenance）: このリポジトリのこのワークフローが、このコミットからビルドした
  #       gh attestation verify rivus_X.Y.Z_linux_amd64.tar.gz --repo yagihash/rivus --signer-workflow yagihash/rivus/.github/workflows/tagpr.yml
  #   - release attestation（immutable releases が公開時に自動で作る）: このファイルが、そのタグの Release のアセットと同じ
  #       gh release verify-asset vX.Y.Z rivus_X.Y.Z_linux_amd64.tar.gz --repo yagihash/rivus
  release-binaries:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # draft の Release へのアップロードと公開
      id-token: write # ビルド来歴の署名（Sigstore）
      attestations: write # ビルド来歴の保存
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tagpr.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # どのターゲットも cgo を使わない（modernc.org/sqlite は純 Go）。静的リンクで、1 台の Linux からまとめてクロスビルドする。
      # 各アーカイブには、rivus の LICENSE と、そのターゲットのバイナリにリンクされたモジュールのライセンス文（LICENSE, COPYING,
      # NOTICE, PATENTS, LICENSE-*）を入れる（MIT / BSD / Apache-2.0 は、バイナリの配布にライセンス文と表示を求める）。
      - name: Build
        env:
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
            name="rivus_${ver}_${GOOS}_${GOARCH}"
            work="build/${name}"
            mkdir -p "${work}/THIRD_PARTY_LICENSES"
            go build -trimpath -ldflags "-s -X main.versionStamp=${ver}" -o "${work}/rivus" ./cmd/rivus
            cp LICENSE "${work}/LICENSE"
            go list -deps -f '{{with .Module}}{{if not .Main}}{{.Path}}@{{.Version}} {{.Dir}}{{end}}{{end}}' ./cmd/rivus | sort -u |
              while read -r mod dir; do
                dest="${work}/THIRD_PARTY_LICENSES/${mod}"
                mkdir -p "${dest}"
                found=0
                for f in "${dir}"/*; do
                  case "$(basename "$f")" in
                    LICENSE*|LICENCE*|COPYING*|NOTICE*|PATENTS*) cp "$f" "${dest}/"; found=1 ;;
                  esac
                done
                if [ "$found" -eq 0 ]; then echo "no license file in ${mod}" >&2; exit 1; fi
              done
            tar -C build -czf "dist/${name}.tar.gz" "${name}"
          done
          (cd dist && sha256sum ./*.tar.gz > "rivus_${ver}_checksums.txt")
          cat dist/*_checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt
      # 公開済みの Release にはもう載せられないので、draft でなければ失敗にする（--clobber は、draft のまま失敗した実行のやり直し用）。
      - name: Upload to the draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ]; then
            echo "the Release of ${TAG} is not a draft: it is published (immutable), so no asset can be added" >&2
            exit 1
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*_checksums.txt --clobber
          gh release edit "$TAG" --draft=false
          # release attestation は公開のときに作られる。すぐには見えないことがあるので、少し待ちながら確かめる
          for i in 1 2 3 4 5 6; do
            if gh release verify "$TAG"; then exit 0; fi
            sleep 10
          done
          echo "the release attestation of ${TAG} could not be verified" >&2
          exit 1

  # タグが打たれたときだけ、tap の formula の url と sha256 を書き換える。
  # トークンは homebrew-tap だけに書けるもの（ghmint の homebrew-tap/.github/ghmint/bump-from-rivus.rego）。
  # Contents API で書くので、コミットは Verified になる。
  bump-tap:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      deployment: false
    permissions:
      id-token: write
    steps:
      - id: token
        uses: yagihash/ghmint-action@be57533eef7f69550d06f0c93eede5589158281a # v1.0.0
        with:
          scope: yagihash/homebrew-tap
          policy: bump-from-rivus
      - name: Update the formula
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: |
          set -euo pipefail
          repo=yagihash/homebrew-tap
          path=Formula/rivus.rb
          url="https://github.com/yagihash/rivus/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          blob=$(gh api "repos/${repo}/contents/${path}" --jq .sha)
          gh api "repos/${repo}/contents/${path}" --jq .content | base64 -d \
            | sed -E "s|^  url \".*\"|  url \"${url}\"|; s|^  sha256 \".*\"|  sha256 \"${sha}\"|" > rivus.rb
          if ! grep -qF "url \"${url}\"" rivus.rb || ! grep -qF "sha256 \"${sha}\"" rivus.rb; then
            echo "the formula has no url or sha256 line to rewrite" >&2
            exit 1
          fi
          gh api -X PUT "repos/${repo}/contents/${path}" \
            -f message="rivus ${TAG#v}" \
            -f content="$(base64 -w0 rivus.rb)" \
            -f sha="$blob"
