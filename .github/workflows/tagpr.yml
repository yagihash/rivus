name: tagpr

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tagpr
  cancel-in-progress: false

jobs:
  # リリース PR を作る・更新する。マージされたら、タグと GitHub Release を作る。
  # CHANGELOG.md は、tagpr がリリース PR の中で更新する（.tagpr の changelog = true）。
  #
  # トークンは、実行ごとに使い分ける（tagpr は、渡されたトークンを 1 つ使うだけ。選ぶのは、このワークフロー）。
  #   - リリース PR を作る・更新する実行（ふつうの push）: このワークフローの GITHUB_TOKEN。
  #     GITHUB_TOKEN で作った・更新した PR の CI は、承認待ちで止まる（書き込みの権限を持つ人が
  #     "Approve workflows to run" を押すと実行される）。リリース PR は main へのマージのたびに更新されるので、
  #     そのたびに全部のテストを実行すると、ほかの PR とジョブを取り合う。リリースするときに承認して、
  #     そこで初めて全部のテストを実行する。ci-ok は必須のチェックなので、成功するまでマージできない。
  #   - タグと Release を作る実行（リリース PR がマージされた直後の push）: ghmint のトークン
  #     （rivus/.github/ghmint/tagpr.rego）。v* のタグを作れるのは、tag の ruleset の例外に入っている
  #     このアプリだけ。GITHUB_TOKEN では作れない。
  # 判定を誤って GITHUB_TOKEN でタグを作ろうとした場合は、ruleset に拒否されて、この実行が失敗する
  # （手動で実行し直す。workflow_dispatch でも、main の先頭がリリース PR のマージなら、同じ判定になる）。
  # コミットは tagpr が API で作るので、どちらのトークンでも GitHub の署名が付く（main の ruleset は署名を必須にしている）。
  # リポジトリの設定 "Allow GitHub Actions to create and approve pull requests" が必要。
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # ghmint（タグと Release を作る実行だけ）
      contents: write # リリース PR のブランチ（GITHUB_TOKEN の実行）
      pull-requests: write # リリース PR の作成と更新、ラベル（GITHUB_TOKEN の実行）
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      # このコミットが、tagpr のリリース PR（ブランチ tagpr-from-*、ラベル tagpr）のマージか。
      # tagpr 自身の判定（マージ済みのリリース PR があれば、タグを打つ）と同じものを、先に見る。
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("tagpr-from-")) and ([.labels[].name] | index("tagpr")))] | length')
          if [ "$n" -gt 0 ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi
          echo "release PR merged at this commit: $n"
      - id: token
        if: steps.mode.outputs.release == 'true'
        uses: yagihash/ghmint-action@be57533eef7f69550d06f0c93eede5589158281a # v1.0.0
        with:
          scope: yagihash/rivus
          policy: tagpr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token || github.token }}
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token || github.token }}

  # タグが打たれたときだけ、Go のバイナリ（linux/amd64, linux/arm64, darwin/arm64）をビルドして、tagpr が draft で作った
  # Release に載せてから公開する。Dart と Rust の extractor は載せない（使う側でビルドする）。
  # immutable releases なので、公開した後はアセットを足せない・差し替えられない。だから、全部のアセットを draft に載せてから、
  # 最後に 1 回だけ公開する。途中で失敗したら、Release は draft のまま残るので、直してこのジョブを実行し直す
  # （Actions の画面の "Re-run failed jobs"。前の実行の tagpr ジョブの出力（タグ）を使って、このジョブだけが動く）。
  # 公開した後（release attestation の確認だけが失敗した場合）に実行し直したときは、ビルドも来歴の作成もしない
  # （公開済みのアセットは変えられないので、作り直しても、公開されたものと別の物になるだけ）。確認だけをやり直す。
  # workflow_dispatch で実行し直すのは、draft のうちだけ。公開した後は、tagpr が既存の Release（draft=false）と
  # 設定（release = draft）の違いでエラーにするので、tagpr ジョブで止まり、このジョブまで来ない。
  # 検証できるものは 2 つ:
  #   - ビルド来歴（actions/attest-build-provenance）: このリポジトリのこのワークフローが、このコミットからビルドした
  #       gh attestation verify rivus_X.Y.Z_linux_amd64.tar.gz --repo yagihash/rivus --signer-workflow yagihash/rivus/.github/workflows/tagpr.yml
  #   - release attestation（immutable releases が公開時に自動で作る）: このファイルが、そのタグの Release のアセットと同じ
  #       gh release verify-asset vX.Y.Z rivus_X.Y.Z_linux_amd64.tar.gz --repo yagihash/rivus
  # ソースの tarball（rivus_X.Y.Z_source.tar.gz。tap の formula が使う）も、同じ 2 つで検証できる（attest の対象は dist/*.tar.gz に入る）
  #       gh attestation verify rivus_X.Y.Z_source.tar.gz --repo yagihash/rivus --signer-workflow yagihash/rivus/.github/workflows/tagpr.yml
  #       gh release verify-asset vX.Y.Z rivus_X.Y.Z_source.tar.gz --repo yagihash/rivus
  # ビルドの手順は scripts/build-release-archives.sh にある（PR では ci.yml の release-build が、同じものを動かす）。
  release-binaries:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # draft の Release へのアップロードと公開
      id-token: write # ビルド来歴の署名（Sigstore）
      attestations: write # ビルド来歴の保存
    steps:
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: |
          set -euo pipefail
          echo "draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)" >> "$GITHUB_OUTPUT"
      - if: steps.state.outputs.draft == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tagpr.outputs.tag }}
          persist-credentials: false
      - if: steps.state.outputs.draft == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        if: steps.state.outputs.draft == 'true'
        env:
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: scripts/build-release-archives.sh "${TAG#v}" "refs/tags/${TAG}"
      - name: Attest build provenance
        if: steps.state.outputs.draft == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt
      # --clobber は、draft のまま失敗した実行のやり直し用。
      - name: Upload to the draft and publish
        if: steps.state.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.tar.gz dist/*_checksums.txt --clobber
          gh release edit "$TAG" --draft=false
      # release attestation は公開のときに作られる。すぐには見えないことがあるので、少し待ちながら確かめる。
      # 公開済みの Release で実行したときは、アセットが揃っていること（tar.gz が 4 つ（バイナリ 3 つとソース 1 つ）とチェックサム）も確かめる。
      - name: Verify the release attestation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: |
          set -euo pipefail
          n=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".tar.gz") or endswith("_checksums.txt"))] | length')
          if [ "$n" -ne 5 ]; then
            echo "the Release of ${TAG} has ${n} of the 5 expected assets (3 binary archives, the source tarball and the checksums)" >&2
            exit 1
          fi
          for _ in 1 2 3 4 5 6; do
            if gh release verify "$TAG"; then exit 0; fi
            sleep 10
          done
          echo "the release attestation of ${TAG} could not be verified (the Release is already published; use 'Re-run failed jobs' to retry only this check: a run by workflow_dispatch stops in tagpr)" >&2
          exit 1

  # タグが打たれたときだけ、tap の formula の url と sha256 を書き換える。url は、Release のソースの tarball（GitHub が自動で作る
  # archive/refs/tags/ のものは、sha256 が変わらないことが保証されない）。release-binaries が公開した後に動く（needs）。
  # トークンは homebrew-tap だけに書けるもの（ghmint の homebrew-tap/.github/ghmint/bump-from-rivus.rego）。
  # Contents API で書くので、コミットは Verified になる。
  bump-tap:
    needs: [tagpr, release-binaries]
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      deployment: false
    permissions:
      id-token: write
      contents: read # scripts/rewrite-formula.sh を取り出す
      attestations: read # `gh attestation verify`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tagpr.outputs.tag }}
          persist-credentials: false
      # formula に書く tarball を、書き換える前に検証する（利用者の環境では検証しない。brew のビルドには gh のログインがないため）。
      #   - ビルド来歴: このリポジトリの tagpr.yml が作った
      #   - release attestation: そのタグの Release のアセットと同じ
      # どちらかが失敗したら、formula は書き換えない。検証した、そのファイルから sha256 を求める。
      - name: Verify the source tarball
        id: tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: |
          set -euo pipefail
          name="rivus_${TAG#v}_source.tar.gz"
          mkdir -p "$RUNNER_TEMP/source"
          gh release download "$TAG" --pattern "$name" --dir "$RUNNER_TEMP/source"
          gh attestation verify "$RUNNER_TEMP/source/$name" --repo "$GH_REPO" \
            --signer-workflow "${GH_REPO}/.github/workflows/tagpr.yml"
          gh release verify-asset "$TAG" "$RUNNER_TEMP/source/$name" --repo "$GH_REPO"
          echo "path=$RUNNER_TEMP/source/$name" >> "$GITHUB_OUTPUT"
      - id: token
        uses: yagihash/ghmint-action@be57533eef7f69550d06f0c93eede5589158281a # v1.0.0
        with:
          scope: yagihash/homebrew-tap
          policy: bump-from-rivus
      - name: Update the formula
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ needs.tagpr.outputs.tag }}
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: |
          set -euo pipefail
          repo=yagihash/homebrew-tap
          path=Formula/rivus.rb
          url="https://github.com/yagihash/rivus/releases/download/${TAG}/rivus_${TAG#v}_source.tar.gz"
          sha=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          blob=$(gh api "repos/${repo}/contents/${path}" --jq .sha)
          gh api "repos/${repo}/contents/${path}" --jq .content | base64 -d | scripts/rewrite-formula.sh "$url" "$sha" > rivus.rb
          gh api -X PUT "repos/${repo}/contents/${path}" \
            -f message="rivus ${TAG#v}" \
            -f content="$(base64 -w0 rivus.rb)" \
            -f sha="$blob"
