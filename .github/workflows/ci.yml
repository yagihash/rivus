name: CI

# One workflow that always starts, and one check that a ruleset can require: `ci-ok` (the last job). The first job (`changes`) looks at
# the files that changed, against the lists in that job ("a change here runs CI"), and the heavy jobs run only when
# something that a test reads, a build takes in, or CI itself changed. A job that is skipped passes in `ci-ok`; a job that failed or was
# cancelled does not. So the number of shards can change without the ruleset. A push to main runs everything.
# The runners of macOS and Linux (the sandbox, docs/DESIGN-macos-sandbox.md and docs/DESIGN-linux-sandbox.md) run when what the isolation is made of changes (the files of that
# system, and the files that both use), and once a week.
# A pull request runs the tests with -short; a push to main, the weekly run and a run by hand run all of them.
# One test is the exception: TestDogfood (rivus analysing itself, 160-230 s) runs only in the weekly run, and only when the code or the models changed since
# the last successful weekly run (the step `dogfood` of `changes`), and in a run by hand. Never in a pull request or a push to main (ADR-112).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

env:
  # A pull request runs the tests with -short: the heavy ones (many runs of the same analysis, the scale profiles, the Google Cloud rows)
  # skip themselves, and run on a push to main, once a week, and by hand. A red run of main is fixed first (or the pull request is reverted).
  # The release pull request of tagpr (its branch starts with `tagpr-from-`) is the exception: it runs what a push to main runs, without -short.
  # (The branch name is only compared in an expression here; it is never given to a shell.)
  SHORT: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'tagpr-from-') && '-short' || '' }}

# A pull request is checked per branch: a new push to it cancels the run in progress. Every other run has a group of its own, so that no
# run replaces another: GitHub keeps one running and one pending run in a group, and a newer run that waits there replaces the pending
# one (even without cancel-in-progress), so a push to main in a group of the branch would lose the run of the commit before it when
# merges follow one another. The tests that run only on main (`TestDeterministic*`, the ones that -short skips) must run to the end for every commit.
# To find which commit broke what, use the run of each commit. The weekly run has a group of its own (it is the run that has TestDogfood), and
# so does every run by hand. (The group of a pull request is its branch; the others are made of the commit or the id of the run.)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.event_name == 'schedule' && 'schedule' || github.event_name == 'push' && format('main-{0}', github.sha) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which of the jobs below have to run. It is the first job, and a job that failed here fails `ci-ok`.
  #   push (main)        everything runs, whatever the lists say (a wrong list shows there)
  #   pull_request       the files that changed, against the lists below (dorny/paths-filter)
  #   schedule           everything, without -short (once a week); workflow_dispatch: everything
  #   tagpr release PR   everything, without -short, as a push to main (the branch starts with `tagpr-from-`; it changes CHANGELOG.md only)
  # `dart` and `rust` are the lists of the two extractors: a change that stays in one language (its extractor, its bench directories) does not set up
  # (and does not build) the other one in the shards of `test`; the tests that need it skip. The places that both read (cmd, internal, testdata, the shared bench, examples, the workflow) are in both lists.
  # A pull request that the action cannot judge fails here (an empty answer must not skip the heavy jobs: the step `decide`, and `ci-ok`).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter asks the API for the files of a pull request
      actions: read # `gh run list`: the last successful weekly run (the step `dogfood`)
    outputs:
      dogfood: ${{ steps.dogfood.outputs.dogfood }}
      code: ${{ steps.decide.outputs.code }}
      isolation_darwin: ${{ steps.decide.outputs.isolation_darwin }}
      isolation_linux: ${{ steps.decide.outputs.isolation_linux }}
      dart: ${{ steps.decide.outputs.dart }}
      rust: ${{ steps.decide.outputs.rust }}
      docs: ${{ steps.decide.outputs.docs }}
      models: ${{ steps.decide.outputs.models }}
      release: ${{ steps.decide.outputs.release }}
      workflows: ${{ steps.decide.outputs.workflows }}
      g12: ${{ steps.decide.outputs.g12 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A change here runs CI; what is not here does not (README.md, docs/, renovate.json ...). When a new top-level directory is added, add it here.
      # A file matches a filter when it matches one of its patterns and none of the ones that start with '!' (some-with-excludes).
      - id: paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'testdata/**'
              - 'dogfood/**'
              - 'extractor/**'
              - '!extractor/*/README.md'
              - 'bench/**'
              - '!bench/**/README.md'
              - '!bench/MISSES.md'
              - '!bench/gitea-cve-paths.md'
              - 'examples/**'
              - '!examples/**/*.md'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'Makefile'
            dart:
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'testdata/**'
              - 'dogfood/**'
              - 'extractor/dart/**'
              - '!extractor/*/README.md'
              - 'bench/**'
              - '!bench/rust-curated/**'
              - '!bench/rust-curated-lib/**'
              - '!bench/rust-curated-ffi/**'
              - '!bench/zoo-rust/**'
              - '!bench/zoo-go-pkg/**'
              - '!bench/zoo-rust-pkg/**'
              - '!bench/rust-synth/**'
              - '!bench/**/README.md'
              - '!bench/MISSES.md'
              - '!bench/gitea-cve-paths.md'
              - 'examples/**'
              - '!examples/**/*.md'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'Makefile'
            rust:
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'testdata/**'
              - 'dogfood/**'
              - 'extractor/rust/**'
              - '!extractor/*/README.md'
              - 'bench/**'
              - '!bench/dart-curated/**'
              - '!bench/zoo-dart/**'
              - '!bench/zoo-go-pkg/**'
              - '!bench/dart-synth/**'
              - '!bench/dart-corpus/**'
              - '!bench/dart-pub/**'
              - '!bench/dart-grpc/**'
              - '!bench/dart-gcp/**'
              - '!bench/**/README.md'
              - '!bench/MISSES.md'
              - '!bench/gitea-cve-paths.md'
              - 'examples/**'
              - '!examples/**/*.md'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'Makefile'
            models:
              - 'internal/model/builtin/*.yaml'
            docs:
              - 'docs/**'
              - '**/*.md'
            release:
              - 'go.mod'
              - 'go.sum'
              - 'scripts/build-release-archives.sh'
              - 'LICENSE'
              - '.github/workflows/ci.yml'
              - '.github/workflows/tagpr.yml'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            g12:
              - 'internal/taint/**'
              - 'internal/sg/**'
              - 'internal/ir/**'
              - 'internal/callgraph/**'
              - 'extractor/dart/**'
              - '!extractor/*/README.md'
              - 'bench/**'
              - '!bench/**/README.md'
            # What the isolation is made of. The jobs of each system run for the files of that system and for the files that both use (a pull request that only
            # touches the Linux files does not start the runner of macOS, and the other way round); a push to main, the weekly run and a run by hand run both.
            isolation_common:
              - 'internal/sandbox/**'
              - '!internal/sandbox/*darwin*'
              - '!internal/sandbox/*linux*'
              - '!internal/sandbox/probe/**'
              - '!internal/sandbox/probelinux/**'
              - 'cmd/rivus/isolate*.go'
              - 'cmd/rivus/term_*.go'
              - '!cmd/rivus/*darwin*.go'
              - '!cmd/rivus/*linux*.go'
              - '!cmd/rivus/isolate_devdir*.go'
              # what decides whether to read under the sandbox, where it keeps its files, and what is said about it
              - 'cmd/rivus/lang.go'
              - 'cmd/rivus/setup.go'
              - 'cmd/rivus/datadir_other.go'
              - 'internal/report/**'
              - 'extractor/rust/**'
              - '!extractor/*/README.md'
              - 'scripts/sandbox-e2e.sh'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            isolation_darwin:
              - 'internal/sandbox/*darwin*'
              - 'internal/sandbox/probe/**'
              - 'cmd/rivus/*darwin*.go'
              - 'cmd/rivus/isolate_devdir*.go'
            isolation_linux:
              - 'internal/sandbox/*linux*'
              - 'internal/sandbox/probelinux/**'
              - 'cmd/rivus/*linux*.go'
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'tagpr-from-') && 'true' || 'false' }}
          FILTER_CODE: ${{ steps.paths.outputs.code }}
          FILTER_ISO_COMMON: ${{ steps.paths.outputs.isolation_common }}
          FILTER_ISO_DARWIN: ${{ steps.paths.outputs.isolation_darwin }}
          FILTER_ISO_LINUX: ${{ steps.paths.outputs.isolation_linux }}
          FILTER_DART: ${{ steps.paths.outputs.dart }}
          FILTER_RUST: ${{ steps.paths.outputs.rust }}
          FILTER_DOCS: ${{ steps.paths.outputs.docs }}
          FILTER_MODELS: ${{ steps.paths.outputs.models }}
          FILTER_RELEASE: ${{ steps.paths.outputs.release }}
          FILTER_WORKFLOWS: ${{ steps.paths.outputs.workflows }}
          FILTER_G12: ${{ steps.paths.outputs.g12 }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              if [ "$RELEASE_PR" = true ]; then
                code=true isolation_darwin=true isolation_linux=true dart=true rust=true docs=true models=false release=true workflows=true g12=false
              else
                for v in "$FILTER_CODE" "$FILTER_ISO_COMMON" "$FILTER_ISO_DARWIN" "$FILTER_ISO_LINUX" "$FILTER_DART" "$FILTER_RUST" "$FILTER_DOCS" "$FILTER_MODELS" "$FILTER_RELEASE" "$FILTER_WORKFLOWS" "$FILTER_G12"; do
                  case "$v" in
                    true | false) ;;
                    *) echo "the filter of the paths gave '$v', not true or false: nothing is skipped on a guess" >&2; exit 1 ;;
                  esac
                done
                isolation_darwin=false isolation_linux=false
                if [ "$FILTER_ISO_COMMON" = true ] || [ "$FILTER_ISO_DARWIN" = true ]; then isolation_darwin=true; fi
                if [ "$FILTER_ISO_COMMON" = true ] || [ "$FILTER_ISO_LINUX" = true ]; then isolation_linux=true; fi
                code=$FILTER_CODE dart=$FILTER_DART rust=$FILTER_RUST docs=$FILTER_DOCS models=$FILTER_MODELS release=$FILTER_RELEASE workflows=$FILTER_WORKFLOWS g12=$FILTER_G12
              fi ;;
            *) code=true isolation_darwin=true isolation_linux=true dart=true rust=true docs=true models=false release=true workflows=true g12=false ;; # push, schedule, workflow_dispatch (the job `model-diff` below runs the weekly and the manual one)
          esac
          {
            echo "code=$code"
            echo "isolation_darwin=$isolation_darwin"
            echo "isolation_linux=$isolation_linux"
            echo "dart=$dart"
            echo "rust=$rust"
            echo "docs=$docs"
            echo "models=$models"
            echo "release=$release"
            echo "workflows=$workflows"
            echo "g12=$g12"
          } >> "$GITHUB_OUTPUT"
      # TestDogfood (RIVUS_DOGFOOD=1 in the job `test`): a run by hand always; the weekly run when the code or the models changed since the head of the last
      # successful weekly run (the first run, a head that is gone, and an answer that cannot be read: it runs). The paths are those of the filter `code`
      # (without the workflow, which only changes how it runs). Nothing else runs it.
      - id: dogfood
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run=false
          case "$EVENT_NAME" in
            workflow_dispatch) run=true ;;
            schedule)
              last=$(gh run list --repo "$REPO" --workflow ci.yml --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
              if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
                run=true; echo "TestDogfood runs: no earlier successful weekly run ('$last')"
              elif git diff --quiet "$last" HEAD -- go.mod go.sum cmd internal testdata dogfood extractor bench examples scripts Makefile \
                ':(exclude,glob)extractor/*/README.md' ':(exclude,glob)bench/**/README.md' ':(exclude)bench/MISSES.md' ':(exclude)bench/gitea-cve-paths.md' ':(exclude,glob)examples/**/*.md'; then
                echo "TestDogfood skipped: nothing that it reads changed since the last successful weekly run ($last)"
              else
                run=true; echo "TestDogfood runs: the code or the models changed since $last"
              fi ;;
          esac
          echo "dogfood=$run" >> "$GITHUB_OUTPUT"

  # `go vet`, the tests of the packages other than cmd/rivus, and the small checks that have no build of their own (each is a step that runs
  # even when one before it failed, so a red step does not hide the others: the name of the step says which one it was).
  go-packages:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the zoo check below reads the history, against the merge base
          persist-credentials: false
      # The caches of Go are kept by steps of our own, and the cache of setup-go is off: it saves only when the key (go.sum) has no entry, so the
      # compiled packages of rivus itself were always stale or absent. A pull request only restores; a push to main (and the weekly run) saves.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Date of the build cache
        id: day
        # the build cache is rotated by the day: `go` deletes the entries that were not used for 5 days when it starts, so a cache that is a week old is almost empty
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # modules: the key is the go.sum of the root and of every module of the bench that has one (bench/gcp); saved only by `go-packages`
      - name: Restore the module cache
        id: gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'bench/*/go.sum') }}
      # compiled packages (GOCACHE): the key is the Go version and the day, the fallback is the latest one of the same Go version. The build cache is
      # addressed by the content of the sources and of the flags, so a stale entry is never used for a changed file: it only costs the compile.
      - name: Restore the build cache
        id: gobuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ steps.day.outputs.day }}
          restore-keys: |
            gobuild-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Save the module cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.gomod.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.gomod.outputs.cache-primary-key }}
      # The tests read the modules of the bench with `go list -export`, which compiles their dependencies (about 14 s on a cold cache, 3 s on a warm
      # one). The step below puts them in the build cache,
      # which is saved after the tests.
      - name: Compile the dependencies of the bench for the cache
        run: make go-warm
      - name: Vet
        run: go vet ./...
      # The files for macOS of cmd/rivus (`*_darwin*.go`: the isolation) are built by no job on Linux: vet them for macOS (no cgo needed)
      - name: Vet the code for macOS
        if: ${{ !cancelled() }}
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go vet ./cmd/rivus ./internal/sandbox
      # The filter of seccomp is made for x86-64 and arm64 only: for another architecture of Linux the package must still build (the helper then says that the
      # sandbox cannot be made, and nothing is run), so that the rest of rivus builds there
      - name: Vet the sandbox for the architectures that have no filter
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
        run: |
          for arch in 386 arm riscv64 ppc64le s390x loong64 mips64le; do
            echo "== $arch"
            GOARCH=$arch go vet ./internal/sandbox
          done
      - name: Test the packages other than cmd/rivus
        if: ${{ !cancelled() }}
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/cmd/rivus$')
          go test ${SHORT:+"$SHORT"} -timeout 30m "${pkgs[@]}"
      # every test of cmd/rivus is in exactly one shard of the job `test` (the matrix there has this many shards)
      - name: Check that the shards run every test once
        if: ${{ !cancelled() }}
        run: make shard-check N=4
      # The tools of the bench (the comparison, the backtest, the ledger): Python only, no build.
      - name: Test the comparison tool
        if: ${{ !cancelled() }}
        run: python3 bench/test_compare.py
      - name: Test the backtest and the ledger tools
        if: ${{ !cancelled() }}
        run: python3 bench/test_backtest.py
      - name: Test the scale-growth tool
        if: ${{ !cancelled() }}
        run: python3 bench/scale-growth/test_scale_growth.py
      - name: Test the ledger of maturity
        if: ${{ !cancelled() }}
        run: python3 bench/test_maturity_ledger.py
      # The call checks of Go and Dart, and the environment of the Rust runs: fixtures only. The tests that run the real extractor are behind
      # CALLCHECK_E2E, which is not set here, so they are skipped.
      - name: Test the call check of Go
        if: ${{ !cancelled() }}
        run: python3 bench/test_go_callcheck.py
      - name: Test the call check of Dart
        if: ${{ !cancelled() }}
        run: python3 bench/test_dart_callcheck.py
      - name: Test the environment of the Rust runs
        if: ${{ !cancelled() }}
        run: python3 bench/test_rustenv.py
      - name: Test the comparison of the observed calls of Dart
        if: ${{ !cancelled() }}
        run: python3 bench/zoo-dart/observed/test_compare.py
      # The graph check, the dependency bench, the ledger of the heavy runs and the lock of the heavy runs (the lock file of the test is in a temporary
      # directory: RIVUS_HEAVY_LOCK). The graph check also builds rivus and runs the benchmark go-curated with 1 and with 8 workers (about 20 s): the result must not depend on the number of workers.
      - name: Test the graph check
        if: ${{ !cancelled() }}
        run: python3 bench/test_graph_check.py
      - name: Test the dependency bench
        if: ${{ !cancelled() }}
        run: python3 bench/test_deps_bench.py
      - name: Test the ledger of the heavy runs
        if: ${{ !cancelled() }}
        run: python3 bench/test_heavy_ledger.py
      - name: Test the lock of the heavy runs
        if: ${{ !cancelled() }}
        run: python3 bench/test_heavylock.py
      # A mark that loosens the truth of the zoo (a row added to a cell that bench/zoo/marks.d already has a file of, or a row of a new cell of
      # a kind other than @sink(none), @miss and @fp; against the merge base) needs a "Zoo-Loosened:" line in a commit message (the
      # user's approval); a new @miss or @fp row needs an @ref(#N) or @ref(model-<package>-<name>) whose file is in docs/issues. TestZooMarksLock (in the shards of the test job) holds the file to the sources.
      - name: Check the commits for a loosened zoo mark
        if: ${{ !cancelled() }}
        # The check is about what a pull request or a push changes: pull_request compares with the base of the pull request, push (main) with the commit before
        # the push (none on a new branch). The weekly run and a run by hand change nothing, so there is nothing to compare.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request | push) ;;
            *) echo "skipped: a $EVENT_NAME run changes nothing to compare with"; exit 0 ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "skipped: no commit before this one to compare with"; exit 0
          fi
          make zoo-loosened BASE="$BASE" HEAD="$HEAD_SHA"
      - name: Save the build cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.gobuild.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gobuild.outputs.cache-primary-key }}

  # A pull request that changes only documents (nothing in the filter `code`) does not run `test`, but the tests that read the documents
  # (links, the files of docs/issues and docs/adr, the references to an ADR) must run: `make test-docs` runs only those. When `code` is
  # true, the shards of `test` run them with everything else.
  docs-tests:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Test the documents
        run: make test-docs

  # The tests of `cmd/rivus` are most of the time (the tests of a package run one after the other): they are divided into SHARDS shards
  # that run in parallel, and this is the only job that runs them: every test runs in exactly one shard, whatever it needs. The names are
  # sorted, and scripts/shard.sh gives each one to one shard (the heavy ones, HEAVY in the script, are spread by their rank; a new
  # test is in some shard whatever its name). A shard does not choose its tests by the language they are about: a name-based
  # choice would drop a new test without a word. What the extractors need is set up in every shard when `changes` says that the change
  # can affect the extractor (`dart` / `rust`), and then a missing setup FAILS the tests (RIVUS_REQUIRE_DART / RIVUS_REQUIRE_RUST=1), it does
  # not skip them. When `changes` says no, nothing is set up and the tests that need the extractor skip, as they do on a developer's machine.
  # The number of shards is the length of the matrix (SHARD_TOTAL comes from it); `make shard-check` in `go-packages` checks the assignment.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # arm64 Linux runner (public repositories only, no extra cost): the same shard is 40-58 s faster than on ubuntu-latest once the caches are warm
    # (experiments in PR #265 and #269; every test, extractor and expectation passed there). To go back to x64: `runs-on: ubuntu-latest`, one line.
    # The caches of this job carry runner.arch in their keys, and main saves them with the same runner as the pull requests restore them with.
    runs-on: ubuntu-26.04-arm
    # the job must outlast `go test -timeout 30m` (the dogfood and the curated tests on a loaded runner)
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DART_SDK: 3.13.6 # the SDK of setup-dart below, and a part of the key of the cache of the compiled extractor
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The caches of Go are kept by steps of our own, and the cache of setup-go is off: it saves only when the key (go.sum) has no entry, so the
      # compiled packages of rivus itself were always stale or absent. A pull request only restores; a push to main (and the weekly run) saves.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Date of the build cache
        id: day
        # the build cache is rotated by the day: `go` deletes the entries that were not used for 5 days when it starts, so a cache that is a week old is almost empty
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # modules: the key is the go.sum of the root and of every module of the bench that has one (bench/gcp); saved only by `go-packages`
      - name: Restore the module cache
        id: gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'bench/*/go.sum') }}
      # compiled packages (GOCACHE): the key is the Go version and the day, the fallback is the latest one of the same Go version. The build cache is
      # addressed by the content of the sources and of the flags, so a stale entry is never used for a changed file: it only costs the compile.
      - name: Restore the build cache
        id: gobuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ steps.day.outputs.day }}
          restore-keys: |
            gobuild-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      # The Dart extractor reads the code with package:analyzer; its tests (and the curated bench) need the Dart SDK and each sample
      # package's `dart pub get`. The tests compile the extractor once for the whole run of a shard (TestMain, `dart compile exe`, about 10 s).
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        if: needs.changes.outputs.dart == 'true'
        with:
          sdk: ${{ env.DART_SDK }}
      # The tests compile the Dart extractor to an executable (TestMain, about 10 s), the same one in every shard. It is kept in a cache: the key is what the
      # extractor is made of (lib, bin, pubspec.yaml, pubspec.lock; what dartSourceHash reads) and the SDK; the test looks for the executable in the
      # directory by its own, exact key too (RIVUS_DART_EXE_DIR), so a hit that is stale only costs the compile, and never judges an old executable.
      # A pull request only restores it; a push to main (and the weekly run) saves it, after the tests, when there was no hit.
      - name: Restore the compiled Dart extractor
        id: dartexe
        if: needs.changes.outputs.dart == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rivus-dart-exe
          key: dartexe-${{ runner.os }}-${{ runner.arch }}-${{ env.DART_SDK }}-${{ hashFiles('extractor/dart/lib/**', 'extractor/dart/bin/**', 'extractor/dart/pubspec.yaml', 'extractor/dart/pubspec.lock') }}
      - name: Write the generated files of the Dart zoo
        if: needs.changes.outputs.dart == 'true'
        # the two pubspec.yaml of the zoo (cells, exec) and exec/lib/cases.dart are made from the directories of the cells and of the skeleton packages:
        # they are not committed, and `dart pub get` and `dart analyze` need them first
        run: make zoo-dart-gen
      - name: Resolve the packages of the extractor and the samples
        if: needs.changes.outputs.dart == 'true'
        # every one of them has a pubspec.lock (the versions are the locked ones, or the step fails), but the two of the Dart zoo
        # (bench/zoo-dart/cells, bench/zoo-dart/exec): those are not committed (written above), and `dart pub get` makes the lock
        run: |
          for d in extractor/dart extractor/dart/test/sample extractor/dart/test/monorepo/app extractor/dart/test/monorepo/shared extractor/dart/test/versions/a extractor/dart/test/versions/b bench/dart-curated; do
            if [ -f "$d/pubspec.yaml" ]; then
              (cd "$d" && dart pub get --enforce-lockfile)
            fi
          done
          for d in bench/zoo-dart/cells bench/zoo-dart/exec; do
            (cd "$d" && dart pub get)
          done
      # The Rust extractor is built against the compiler's MIR (rustc_public), which is nightly only: it is pinned to one nightly by
      # extractor/rust/rust-toolchain.toml. The cache holds the toolchains of rustup and nothing else; its key is that file (the channel, the
      # components): a new pin is a new key. The install below runs on a hit too (it finds the toolchain and has nothing to do), so a cache
      # that is incomplete costs time, not a wrong toolchain.
      # A pull request only restores it (the post step of a plain `actions/cache` saves on a miss, which took 58 s); a push to main saves it, after the install.
      - name: Cache the pinned nightly
        id: rustup
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('extractor/rust/rust-toolchain.toml') }}
      - name: Install the pinned nightly
        if: needs.changes.outputs.rust == 'true'
        working-directory: extractor/rust
        run: rustup toolchain install
      - name: Save the pinned nightly
        if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request' && steps.rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains
          key: ${{ steps.rustup.outputs.cache-primary-key }}
      # build.rs puts the hash of the source of the extractor (ADR-126) into `--rivus-version`; without it the build says `source=unknown` and
      # TestRustExtractorSaysItsSourceHash skips. Go is set up above in this job.
      - name: Build the Rust extractor
        if: needs.changes.outputs.rust == 'true'
        run: |
          RIVUS_EXTRACTOR_SRC_HASH="$(go run ./scripts/extractor-hash rust)"
          export RIVUS_EXTRACTOR_SRC_HASH
          cd extractor/rust
          cargo build --locked
      # The checks that are not tests of cmd/rivus run once, in one shard (shard 2: the lightest of a pull request, after the first).
      - name: Analyze the Dart extractor
        if: needs.changes.outputs.dart == 'true' && matrix.shard == 2
        working-directory: extractor/dart
        run: dart analyze lib bin
      - name: Test the Dart extractor
        if: needs.changes.outputs.dart == 'true' && matrix.shard == 2
        # `dart test` of the extractor package alone (dart_test.yaml lists the tests: the samples under test/ are other packages and are not run); about 10 s
        working-directory: extractor/dart
        run: dart test
      - name: Analyze the Dart zoo
        if: needs.changes.outputs.dart == 'true' && matrix.shard == 2
        run: |
          for d in bench/zoo-dart/cells bench/zoo-dart/exec; do
            (cd "$d" && dart analyze)
          done
      - name: Test the Rust extractor
        if: needs.changes.outputs.rust == 'true' && matrix.shard == 2
        working-directory: extractor/rust
        run: cargo test --locked
      # The Rust zoo has no dependency (std only, no build.rs, no proc macro): the extractor builds what it reads.
      # The packages of the Rust zoo (bench/zoo-rust-pkg/<package>: a skeleton of an external package, path dependencies only) are found, built and run by
      # TestZooPkgRust in the step of the shard below: nothing is listed here, and the time grows by the cells and the skeleton of a package.
      - name: Build the Rust zoo
        if: needs.changes.outputs.rust == 'true' && matrix.shard == 2
        working-directory: bench/zoo-rust
        run: cargo build --locked --offline
      - name: Test the harness of the Rust zoo
        if: needs.changes.outputs.rust == 'true' && matrix.shard == 2
        working-directory: bench/zoo-rust/exec
        run: cargo test --locked --offline
      - name: Compile the dependencies of the bench for the cache
        run: make go-warm
      - name: Test cmd/rivus (one shard of the matrix)
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          # set when `changes` says that the change can affect the extractor, and then a missing one fails the tests (REQUIRE), and does not skip them
          RIVUS_DART: ${{ needs.changes.outputs.dart == 'true' && 'dart' || '' }}
          RIVUS_REQUIRE_DART: ${{ needs.changes.outputs.dart == 'true' && '1' || '' }}
          RIVUS_RUST: ${{ needs.changes.outputs.rust == 'true' && format('{0}/extractor/rust/target/debug/rivus-rust', github.workspace) || '' }}
          RIVUS_REQUIRE_RUST: ${{ needs.changes.outputs.rust == 'true' && '1' || '' }}
          # the Rust extractor is built above with its source hash: `source=unknown` fails TestRustExtractorSaysItsSourceHash, and does not skip it
          RIVUS_REQUIRE_EXTRACTOR_HASH: ${{ needs.changes.outputs.rust == 'true' && '1' || '' }}
          # a missing module cache of bench/gcp fails the Google Cloud gate, and does not skip it
          RIVUS_REQUIRE_GCP: "1"
          # TestDogfood skips itself without this (ADR-112): the weekly run when something changed, and a run by hand
          RIVUS_DOGFOOD: ${{ needs.changes.outputs.dogfood == 'true' && '1' || '' }}
          # where the compiled Dart extractor is looked for and kept (the cache above)
          RIVUS_DART_EXE_DIR: ${{ needs.changes.outputs.dart == 'true' && format('{0}/rivus-dart-exe', runner.temp) || '' }}
        run: make test-shard I="$SHARD_INDEX" N="$SHARD_TOTAL"
      - name: Save the build cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.gobuild.outputs.cache-hit != 'true' && matrix.shard == 0 }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gobuild.outputs.cache-primary-key }}
      - name: Save the compiled Dart extractor
        if: ${{ !cancelled() && needs.changes.outputs.dart == 'true' && github.event_name != 'pull_request' && steps.dartexe.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rivus-dart-exe
          key: ${{ steps.dartexe.outputs.cache-primary-key }}

  # bench/gcp run for real, against fakes (exec_test.go): the value of a vulnerable case reaches the SQL text, the
  # value of a fixed one only the parameters. The test refuses every connection that is not loopback.
  gcp-exec:
    needs: changes
    # the cases run for real: main, once a week, and the release pull request of tagpr (a pull request runs the tests with -short)
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'tagpr-from-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # the key is the go.sum of the root and of every module of the bench that has one (bench/gcp): the cache that holds the compiled
          # dependencies of the bench modules is not the one that was made without them
          cache-dependency-path: |
            go.sum
            bench/*/go.sum
      - name: Test the cases by running them
        working-directory: bench/gcp
        run: go test -tags gcpexec -timeout 10m ./...

  # The tests of the sandbox of macOS (internal/sandbox, docs/DESIGN-macos-sandbox.md) on a runner of macOS. They run when something that
  # the isolation is made of changes, and once a week (the sandbox and its profile can break when macOS or Xcode is updated, with no change
  # of the code).
  #
  # Only the tests that need no toolchain: what the probe cannot do under the sandbox, the ways out that are closed, the limits. The
  # extraction of Rust under the sandbox (the toolchain, the fetch) are the jobs `sandbox-e2e-linux` and `sandbox-e2e-darwin` below, and on the machine of the developer (RIVUS_SBX_RED=1, RIVUS_SBX_NET=1).
  sandbox:
    needs: changes
    if: needs.changes.outputs.isolation_darwin == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # the key is the go.sum of the root and of every module of the bench that has one (bench/gcp): the cache that holds the compiled
          # dependencies of the bench modules is not the one that was made without them
          cache-dependency-path: |
            go.sum
            bench/*/go.sum
      - name: Test the sandbox (darwin)
        env:
          # the tests make harmless marks outside the sandbox when it does not hold (a name rivus-sbx-<id>, removed after), and say so
          RIVUS_SBX_RED: "1"
        run: go test -count=1 -timeout 20m -run 'TestSandbox(Stops|Closes|Time|Output|Environment|Unavailable|Stderr|Program)' ./internal/sandbox

  # The tests of the sandbox of Linux (internal/sandbox, docs/DESIGN-linux-sandbox.md: Landlock and seccomp) on the runners of Linux, x86-64 and arm64
  # (the filter of seccomp is made for each architecture). Same triggers as the one of macOS. RIVUS_SBX_RED=1: a runner that has no sandbox fails
  # the job instead of skipping the tests (a skip would show nothing). The tests that need a newer kernel (the port of a connection: Landlock ABI 4) say
  # so and skip when this kernel is older.
  sandbox-linux:
    needs: changes
    if: needs.changes.outputs.isolation_linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        # every one of these runners has a Linux of the 7.0 series (checked: `uname -r` in the log), so none has an old Landlock; an old kernel is made by the
        # tests of a test binary (RIVUS_SBX_FAKE_ABI, TestSandboxOldKernels). ubuntu-24.04 differs in the userland (GNU coreutils; ubuntu-latest has the Rust ones, which are
        # in /usr/lib/cargo/bin: that is how the test of the programs that may be run found a hole)
        runner: [ubuntu-latest, ubuntu-26.04-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/*/go.sum
      - name: The kernel
        run: |
          uname -r
          cat /sys/kernel/security/lsm || true
      - name: Test the sandbox (linux)
        env:
          RIVUS_SBX_RED: "1"
        run: go test -count=1 -timeout 20m -v -run 'TestSandbox' ./internal/sandbox
      # The runner is not root, and the checks that matter when rivus is run as root (the capabilities that are taken away, a file that cannot be given to another
      # user) run only for root: the same tests, as root. (The test binary is built here, by the user, and run by root in its directory.)
      - name: Test the sandbox as root (linux)
        env:
          RIVUS_SBX_RED: "1"
        run: |
          go test -c -o "$RUNNER_TEMP/sandbox.test" ./internal/sandbox
          cd internal/sandbox
          sudo env "PATH=$PATH" "GOTOOLCHAIN=local" "RIVUS_SBX_RED=1" "GOCACHE=$RUNNER_TEMP/gocache-root" "GOMODCACHE=$(go env GOMODCACHE)" \
            "$RUNNER_TEMP/sandbox.test" -test.count=1 -test.v -test.run 'TestSandbox(ProbeEscapes|ClosesEveryWayOut|Baseline|AttrAsRoot)'

  # The sandbox end to end, on each system that has one (two jobs, so that each runs only for the files of its system): the pinned nightly, the extractor
  # (rivus setup rust), and a crate with a hostile build script and a proc macro and build scripts of dependencies, read by `rivus analyze -lang rust`
  # (scripts/sandbox-e2e.sh): the fetch with the network, the extraction without it, nothing written outside, the isolation said to be "sandbox". The unit
  # tests above need no toolchain; this is the way a user reaches the sandbox.
  sandbox-e2e-linux:
    needs: changes
    if: needs.changes.outputs.isolation_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/*/go.sum
      - name: Install the pinned nightly
        working-directory: extractor/rust
        run: rustup toolchain install
      - name: Build rivus and the extractor
        run: |
          go build -o "$RUNNER_TEMP/rivus" ./cmd/rivus
          RIVUS_RUST_DATA_DIR="$RUNNER_TEMP/rivus-data" "$RUNNER_TEMP/rivus" setup rust -source extractor/rust -y
      - name: Read a hostile crate under the sandbox
        env:
          RIVUS_RUST_DATA_DIR: ${{ runner.temp }}/rivus-data
        run: scripts/sandbox-e2e.sh "$RUNNER_TEMP/rivus"

  sandbox-e2e-darwin:
    needs: changes
    if: needs.changes.outputs.isolation_darwin == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/*/go.sum
      - name: Install the pinned nightly
        working-directory: extractor/rust
        run: rustup toolchain install
      - name: Build rivus and the extractor
        run: |
          go build -o "$RUNNER_TEMP/rivus" ./cmd/rivus
          RIVUS_RUST_DATA_DIR="$RUNNER_TEMP/rivus-data" "$RUNNER_TEMP/rivus" setup rust -source extractor/rust -y
      - name: Read a hostile crate under the sandbox
        env:
          RIVUS_RUST_DATA_DIR: ${{ runner.temp }}/rivus-data
        run: scripts/sandbox-e2e.sh "$RUNNER_TEMP/rivus"

  # The differential test of the models (bench/model-diff, docs/MODEL-RUNBOOK.md): a package at a time, its model against its body. Only the
  # weekly run and a run by hand, and it reports without blocking (`continue-on-error`) until it has been run for a while; it is not in a pull request
  # (the plan for that: docs/DESIGN-package-models.md, 7). Go and Dart only: a Rust crate is built to be read, and that needs the isolation.
  model-diff:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg: [strings, path/filepath, encoding/json, net/url, bytes, strconv, "package:http"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # the key is the go.sum of the root and of every module of the bench that has one (bench/gcp): the cache that holds the compiled
          # dependencies of the bench modules is not the one that was made without them
          cache-dependency-path: |
            go.sum
            bench/*/go.sum
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: 3.13.6
      - name: Check the model of the package
        env:
          PKG: ${{ matrix.pkg }}
          RIVUS_DART: dart
        run: make model-diff PKG="$PKG"

  # The differential test of the packages whose model rows a pull request changes (the rows of internal/model/builtin/*.yaml that differ from the base:
  # `make model-diff-changed`, bench/model-diff, docs/MODEL-RUNBOOK.md). Go only; a changed package of Dart or Rust is listed as not run. It fetches the
  # packages (`go get`) and never runs them. It fails on a MISS, an EXTRA that no note allows, and a row whose symbol is not in the package. Skipped
  # (and a pass in `ci-ok`) when no model file changed.
  model-diff-changed:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.models == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the rows at the base are read with `git show`
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/*/go.sum
      - name: Check the model of each changed package
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make model-diff-changed BASE="$BASE"

  # The graph check of the same commit with 1 and with 8 workers (bench/compare.sh --graph-check, docs/WORKFLOW.md): the IR, the edges, the summaries and
  # the findings must be the same, whatever the order of the work. The weekly run and a run by hand only. A difference or a failed run fails the job (and `ci-ok`).
  # The benchmarks are the small ones (the standard library, the zoo, curated); memos and Gitea are not run here.
  graph-check:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/*/go.sum
      - name: Check that the graph does not depend on the number of workers
        # no other work runs on this machine, so the guard that waits for a quiet one is off
        # Each target is its own call: only zoo-go may end with exit 4 ("the same everywhere, and only an analysis did not converge": it has cells that stop by the
        # pass limit on purpose, docs/issues/217). go-std10 and go-curated must end with 0, so one that stops converging later still fails the job.
        # 1 (a difference), 2 (a run failed) and 3 (a part was not compared) fail it for every target.
        run: |
          bench/compare.sh --graph-check go-std10 --graph-workers 1,8 --no-guard HEAD HEAD
          rc=0
          bench/compare.sh --graph-check zoo-go --graph-workers 1,8 --no-guard HEAD HEAD || rc=$?
          if [ "$rc" = 4 ]; then
            echo "::notice::graph check of zoo-go: same, and an analysis did not converge (exit 4, accepted for zoo-go only: docs/issues/217)"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
          bench/compare.sh --graph-check go-curated --graph-workers 1,8 --no-guard HEAD HEAD

  # G12: a warning for a rise of the cost (bench/compare.sh, bench/README.md "The cost warning"). A pull request that changes the engine or what it is measured on
  # (the filter `g12`) runs the small targets on the base and on the head and compares `adds_total`, `adds_max_function_total`, `passes` and `largest_scc`; a rise
  # of 10% or more is a `::warning::` in the log and a line in the summary of the job. It is a warning, not a gate: the job does not fail (continue-on-error, and
  # the step ignores the exit status of compare.sh), and a failure to measure is a warning too.
  cost-warn:
    needs: changes
    if: needs.changes.outputs.g12 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    env:
      DART_SDK: 3.13.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base is the first parent of the merge commit that is checked out
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/*/go.sum
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ env.DART_SDK }}
      - name: Compare the cost of the base and the head
        run: |
          base=$(git rev-parse HEAD^1)
          rc=0
          bench/compare.sh --only go-curated,dart-curated,go-synth-S,dart-synth-S,dart-synth-M,dart-synth-F --cost-rounds 1 --no-guard --no-cache "$base" HEAD || rc=$?
          if [ "$rc" != 0 ]; then
            echo "::warning title=G12 cost::compare.sh ended with exit status $rc (1: a finding was removed; 2: a benchmark did not run): read the summary of the job"
          fi

  # The archives of a release (tagpr.yml, job `release-binaries`) are built only when a tag is made. Build them here as well, so that what would stop a
  # release stops the pull request first: a linked dependency with a copyleft or forbidden license (`go-licenses check`: restricted, reciprocal,
  # forbidden), or a module without a license file. A pull request runs it when the dependencies (go.mod, go.sum) or the build itself (the script, the
  # two workflows) changed (the filter `release`); a push to main, the weekly run and a run by hand always run it. The one change that this misses in
  # a pull request: code that starts to import a package of a module that go.mod already has. The run on main finds it.
  release-build:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: scripts/build-release-archives.sh 0.0.0-check HEAD

  # The lint of the workflows (it was the workflow ghalint.yml). Two jobs, named `ghalint` and `actionlint` as the checks that the ruleset
  # required before, so that the ruleset is met with or without them in its list; `ci-ok` has both in `needs`. They run when a workflow or a
  # local action changed (the filter `workflows`), and on a push to main, the weekly run and a run by hand; a skipped job passes in `ci-ok`.
  # Both tools are downloaded from the release and checked with their attestation.
  ghalint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # `gh attestation verify`
    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ghalint
        run: |
          # renovate: datasource=github-releases depName=suzuki-shunsuke/ghalint
          version=v1.5.6
          gh release download -R suzuki-shunsuke/ghalint "${version}" -p "ghalint_${version#v}_linux_amd64.tar.gz"
          gh attestation verify "ghalint_${version#v}_linux_amd64.tar.gz" \
            -R suzuki-shunsuke/ghalint \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          tar xzf "ghalint_${version#v}_linux_amd64.tar.gz" ghalint
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run ghalint run
        run: ./ghalint run

      - name: Run ghalint act
        if: ${{ !cancelled() }}
        run: ./ghalint act


  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read # `gh attestation verify`
    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version=v1.7.12
          gh release download -R rhysd/actionlint "${version}" -p "actionlint_${version#v}_linux_amd64.tar.gz"
          gh attestation verify "actionlint_${version#v}_linux_amd64.tar.gz" --repo rhysd/actionlint
          tar xzf "actionlint_${version#v}_linux_amd64.tar.gz" actionlint
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run actionlint
        run: |
          ./actionlint \
            -ignore 'label "ubuntu-26.04-arm" is unknown'


  # The one check that a ruleset requires. Every job above is in `needs`: it fails when one of them failed or was cancelled, and passes
  # when they passed or were skipped (nothing that a test reads changed). A job added above has to be added here.
  ci-ok:
    if: always()
    needs: [changes, go-packages, docs-tests, test, gcp-exec, sandbox, sandbox-linux, sandbox-e2e-linux, sandbox-e2e-darwin, model-diff, model-diff-changed, graph-check, cost-warn, release-build, ghalint, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: yagihash/actions/ci-ok@b2075301726190d59d2cf57e54d62700c55ae134 # v0.1.0
        with:
          needs: ${{ toJSON(needs) }}
          filter-job: changes
          filter-outputs: |
            code
            isolation_darwin
            isolation_linux
            dart
            rust
            docs
            models
            release
            workflows
