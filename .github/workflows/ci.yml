name: CI

# One workflow that always starts, and one check that a ruleset can require: `ci-ok` (the last job). The first job (`changes`) looks at
# the files that changed, against the lists in that job ("a change here runs CI"), and the heavy jobs run only when
# something that a test reads, a build takes in, or CI itself changed. A job that is skipped passes in `ci-ok`; a job that failed or was
# cancelled does not. So the number of shards can change without the ruleset. A push to main runs everything.
# The runner of macOS (the sandbox, docs/DESIGN-macos-sandbox.md) runs when what the isolation is made of changes, and once a week.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

# A push to main that lands on a run in progress cancels it: only the newest commit is checked (to find which commit
# broke what, use `git bisect` and a local reproduction). A pull request is checked per branch.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Which of the jobs below have to run. It is the first job, and a job that failed here fails `ci-ok`.
  #   push (main)        everything runs, whatever the lists say (a wrong list shows there)
  #   pull_request       the files that changed, against the lists below (dorny/paths-filter)
  #   schedule           only the macOS job; workflow_dispatch: everything
  # A pull request that the action cannot judge fails here (an empty answer must not skip the heavy jobs: the step `decide`, and `ci-ok`).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter asks the API for the files of a pull request
    outputs:
      code: ${{ steps.decide.outputs.code }}
      isolation: ${{ steps.decide.outputs.isolation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A change here runs CI; what is not here does not (README.md, docs/, renovate.json ...). When a new top-level directory is added, add it here.
      # A file matches a filter when it matches one of its patterns and none of the ones that start with '!' (some-with-excludes).
      - id: paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'testdata/**'
              - 'dogfood/**'
              - 'extractor/**'
              - '!extractor/*/README.md'
              - 'bench/**'
              - '!bench/**/README.md'
              - '!bench/MISSES.md'
              - '!bench/gitea-cve-paths.md'
              - 'examples/**'
              - '!examples/**/*.md'
              - '.github/workflows/**'
              - '.github/scripts/**'
            isolation:
              - 'internal/sandbox/**'
              - 'cmd/rivus/isolate*.go'
              - 'extractor/rust/**'
              - '!extractor/*/README.md'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.paths.outputs.code }}
          FILTER_ISOLATION: ${{ steps.paths.outputs.isolation }}
        run: |
          case "$EVENT_NAME" in
            schedule) code=false isolation=true ;;
            pull_request)
              for v in "$FILTER_CODE" "$FILTER_ISOLATION"; do
                case "$v" in
                  true | false) ;;
                  *) echo "the filter of the paths gave '$v', not true or false: nothing is skipped on a guess" >&2; exit 1 ;;
                esac
              done
              code=$FILTER_CODE isolation=$FILTER_ISOLATION ;;
            *) code=true isolation=true ;; # push, workflow_dispatch
          esac
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "isolation=$isolation" >> "$GITHUB_OUTPUT"

  # The tests of `cmd/rivus` are most of the time (the tests of a package run one after the other): they are divided
  # into shards that run in parallel (every test runs in exactly one shard). Shard 0 runs the other packages.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # the job must outlast `go test -timeout 30m` (the dogfood and the curated tests on a loaded runner)
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      # a missing module cache of bench/gcp fails the Google Cloud gate, and does not skip it
      RIVUS_REQUIRE_GCP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        if: matrix.shard == 0
        run: go vet ./...
      - name: Test the packages other than cmd/rivus
        if: matrix.shard == 0
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/cmd/rivus$')
          go test -timeout 30m "${pkgs[@]}"
      - name: Test cmd/rivus (shards 1 to 4 of four)
        if: matrix.shard != 0
        run: bash .github/scripts/go-test-shard.sh ./cmd/rivus "$((SHARD - 1))" 4 -timeout 30m

  # The tools of the bench (the comparison, the backtest, the ledger) have their own job: a red `test` job must not keep
  # them from running (they were the last step of it, and did not run while it was red). Python only, no build.
  bench-tools:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the comparison tool
        run: python3 bench/test_compare.py
      - name: Test the backtest and the ledger tools
        run: python3 bench/test_backtest.py

  # The Dart extractor reads the code with package:analyzer; its tests (and the curated bench) need the Dart
  # SDK and each sample package's `dart pub get`. They are skipped when RIVUS_DART is not set.
  dart:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: 3.13.6
      - name: Resolve the packages of the extractor and the samples
        # every one of them has a pubspec.lock: the versions are the locked ones, or the step fails
        run: |
          for d in extractor/dart extractor/dart/test/sample bench/dart-curated bench/zoo-dart/cells bench/zoo-dart/exec; do
            if [ -f "$d/pubspec.yaml" ]; then
              (cd "$d" && dart pub get --enforce-lockfile)
            fi
          done
      - name: Analyze the extractor
        if: matrix.shard == 0
        working-directory: extractor/dart
        run: dart analyze lib bin
      - name: Analyze the Dart zoo
        if: matrix.shard == 0
        run: |
          for d in bench/zoo-dart/cells bench/zoo-dart/exec; do
            (cd "$d" && dart analyze)
          done
      - name: Test with the Dart extractor (one shard of three)
        env:
          RIVUS_DART: dart
          # a missing RIVUS_DART fails the tests, and does not skip them
          RIVUS_REQUIRE_DART: "1"
        run: bash .github/scripts/go-test-shard.sh ./cmd/rivus "$SHARD" 3 -timeout 30m

  # The Rust extractor is built against the compiler's MIR (rustc_public), which is nightly only: it is pinned
  # to one nightly by extractor/rust/rust-toolchain.toml.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the pinned nightly
        working-directory: extractor/rust
        run: rustup toolchain install
      - name: Build the extractor
        working-directory: extractor/rust
        run: cargo build --locked
      - name: Test the extractor
        if: matrix.shard == 0
        working-directory: extractor/rust
        run: cargo test --locked
      # The Rust zoo has no dependency (std only, no build.rs, no proc macro): the extractor builds what it reads.
      - name: Build the Rust zoo
        working-directory: bench/zoo-rust
        run: cargo build --locked --offline
      - name: Test the harness of the Rust zoo
        if: matrix.shard == 0
        working-directory: bench/zoo-rust/exec
        run: cargo test --locked --offline
      - name: Test with the Rust extractor (one shard of three)
        run: bash .github/scripts/go-test-shard.sh ./cmd/rivus "$SHARD" 3 -timeout 30m
        env:
          RIVUS_RUST: ${{ github.workspace }}/extractor/rust/target/debug/rivus-rust
          # a missing RIVUS_RUST fails the tests, and does not skip them
          RIVUS_REQUIRE_RUST: "1"

  # bench/gcp run for real, against fakes (exec_test.go): the value of a vulnerable case reaches the SQL text, the
  # value of a fixed one only the parameters. The test refuses every connection that is not loopback.
  gcp-exec:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test the cases by running them
        working-directory: bench/gcp
        run: go test -tags gcpexec -timeout 10m ./...

  # A mark that loosens the truth of the zoo (a row added to bench/zoo/marks.lock) needs a "Zoo-Loosened:" line in the
  # commit message (the user's approval). TestZooMarksLock (in the shards of the test job) holds the file to the sources.
  zoo-loosened:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/zoo-loosened-check.sh "$BASE" "$HEAD_SHA"

  # The tests of the sandbox of macOS (internal/sandbox, docs/DESIGN-macos-sandbox.md) on a runner of macOS. They run when something that
  # the isolation is made of changes, and once a week (the sandbox and its profile can break when macOS or Xcode is updated, with no change
  # of the code).
  #
  # Only the tests that need no toolchain: what the probe cannot do under the sandbox, the ways out that are closed, the limits. The
  # extraction of Rust under the sandbox (the toolchain, the fetch) is tried on the machine of the developer (RIVUS_SBX_RED=1, RIVUS_SBX_NET=1).
  sandbox:
    needs: changes
    if: needs.changes.outputs.isolation == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test the sandbox
        env:
          # the tests make harmless marks outside the sandbox when it does not hold (a name rivus-sbx-<id>, removed after), and say so
          RIVUS_SBX_RED: "1"
        run: go test -count=1 -timeout 20m -run 'TestSandbox(Stops|Closes|Time|Output|Environment|Unavailable|Stderr|Program)' ./internal/sandbox

  # The one check that a ruleset requires. Every job above is in `needs`: it fails when one of them failed or was cancelled, and passes
  # when they passed or were skipped (nothing that a test reads changed). A job added above has to be added here.
  ci-ok:
    if: always()
    needs: [changes, test, bench-tools, dart, rust, gcp-exec, zoo-loosened, sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Look at the jobs
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # `changes` has to have answered: a skipped heavy job is only a pass when it was skipped on an answer
          echo "$NEEDS" | jq -e '.changes.result == "success" and (.changes.outputs.code | IN("true", "false")) and (.changes.outputs.isolation | IN("true", "false"))' > /dev/null
          echo "$NEEDS" | jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' > /dev/null
