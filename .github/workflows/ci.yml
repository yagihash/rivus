name: CI

# One workflow that always starts, and one check that a ruleset can require: `ci-ok` (the last job). The first job (`changes`) looks at
# the files that changed, against the lists in that job ("a change here runs CI"), and the heavy jobs run only when
# something that a test reads, a build takes in, or CI itself changed. A job that is skipped passes in `ci-ok`; a job that failed or was
# cancelled does not. So the number of shards can change without the ruleset. A push to main runs everything.
# The runner of macOS (the sandbox, docs/DESIGN-macos-sandbox.md) runs when what the isolation is made of changes, and once a week.
# A pull request runs the tests with -short; a push to main, the weekly run and a run by hand run all of them.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

env:
  # A pull request runs the tests with -short: the heavy ones (many runs of the same analysis, the scale profiles, the Google Cloud rows)
  # skip themselves, and run on a push to main, once a week, and by hand. A red run of main is fixed first (or the pull request is reverted).
  # The release pull request of tagpr (its branch starts with `tagpr-from-`) is the exception: it runs what a push to main runs, without -short.
  # (The branch name is only compared in an expression here; it is never given to a shell.)
  SHORT: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'tagpr-from-') && '-short' || '' }}

# A push to main that lands on a run in progress cancels it: only the newest commit is checked (to find which commit
# broke what, use `git bisect` and a local reproduction). A pull request is checked per branch.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Which of the jobs below have to run. It is the first job, and a job that failed here fails `ci-ok`.
  #   push (main)        everything runs, whatever the lists say (a wrong list shows there)
  #   pull_request       the files that changed, against the lists below (dorny/paths-filter)
  #   schedule           everything, without -short (once a week); workflow_dispatch: everything
  #   tagpr release PR   everything, without -short, as a push to main (the branch starts with `tagpr-from-`; it changes CHANGELOG.md only)
  # `dart` and `rust` are the lists of the two extractor jobs: a change that stays in one language (its extractor, its bench directories) skips the job of
  # the other one. The places that both read (cmd, internal, testdata, the shared bench, examples, the workflow) are in both lists.
  # A pull request that the action cannot judge fails here (an empty answer must not skip the heavy jobs: the step `decide`, and `ci-ok`).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter asks the API for the files of a pull request
    outputs:
      code: ${{ steps.decide.outputs.code }}
      isolation: ${{ steps.decide.outputs.isolation }}
      dart: ${{ steps.decide.outputs.dart }}
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A change here runs CI; what is not here does not (README.md, docs/, renovate.json ...). When a new top-level directory is added, add it here.
      # A file matches a filter when it matches one of its patterns and none of the ones that start with '!' (some-with-excludes).
      - id: paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'testdata/**'
              - 'dogfood/**'
              - 'extractor/**'
              - '!extractor/*/README.md'
              - 'bench/**'
              - '!bench/**/README.md'
              - '!bench/MISSES.md'
              - '!bench/gitea-cve-paths.md'
              - 'examples/**'
              - '!examples/**/*.md'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'Makefile'
            dart:
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'testdata/**'
              - 'dogfood/**'
              - 'extractor/dart/**'
              - '!extractor/*/README.md'
              - 'bench/**'
              - '!bench/rust-curated/**'
              - '!bench/rust-curated-lib/**'
              - '!bench/rust-curated-ffi/**'
              - '!bench/zoo-rust/**'
              - '!bench/zoo-go-pkg/**'
              - '!bench/zoo-rust-pkg/**'
              - '!bench/rust-synth/**'
              - '!bench/**/README.md'
              - '!bench/MISSES.md'
              - '!bench/gitea-cve-paths.md'
              - 'examples/**'
              - '!examples/**/*.md'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'Makefile'
            rust:
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'testdata/**'
              - 'dogfood/**'
              - 'extractor/rust/**'
              - '!extractor/*/README.md'
              - 'bench/**'
              - '!bench/dart-curated/**'
              - '!bench/zoo-dart/**'
              - '!bench/zoo-go-pkg/**'
              - '!bench/dart-synth/**'
              - '!bench/dart-corpus/**'
              - '!bench/dart-pub/**'
              - '!bench/dart-grpc/**'
              - '!bench/dart-gcp/**'
              - '!bench/**/README.md'
              - '!bench/MISSES.md'
              - '!bench/gitea-cve-paths.md'
              - 'examples/**'
              - '!examples/**/*.md'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'Makefile'
            isolation:
              - 'internal/sandbox/**'
              - 'cmd/rivus/isolate*.go'
              - 'extractor/rust/**'
              - '!extractor/*/README.md'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'tagpr-from-') && 'true' || 'false' }}
          FILTER_CODE: ${{ steps.paths.outputs.code }}
          FILTER_ISOLATION: ${{ steps.paths.outputs.isolation }}
          FILTER_DART: ${{ steps.paths.outputs.dart }}
          FILTER_RUST: ${{ steps.paths.outputs.rust }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              if [ "$RELEASE_PR" = true ]; then
                code=true isolation=true dart=true rust=true
              else
                for v in "$FILTER_CODE" "$FILTER_ISOLATION" "$FILTER_DART" "$FILTER_RUST"; do
                  case "$v" in
                    true | false) ;;
                    *) echo "the filter of the paths gave '$v', not true or false: nothing is skipped on a guess" >&2; exit 1 ;;
                  esac
                done
                code=$FILTER_CODE isolation=$FILTER_ISOLATION dart=$FILTER_DART rust=$FILTER_RUST
              fi ;;
            *) code=true isolation=true dart=true rust=true ;; # push, schedule, workflow_dispatch
          esac
          {
            echo "code=$code"
            echo "isolation=$isolation"
            echo "dart=$dart"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"

  # `go vet` and the tests of the packages other than cmd/rivus.
  go-packages:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test the packages other than cmd/rivus
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/cmd/rivus$')
          go test ${SHORT:+"$SHORT"} -timeout 30m "${pkgs[@]}"

  # The tests of `cmd/rivus` are most of the time (the tests of a package run one after the other): they are divided
  # into shards that run in parallel. Every test runs in exactly one shard of this job: the names are sorted, and a shard takes
  # the ones at its places. The heaviest one (the first of HEAVY) is alone in shard 0, the other heavy ones are spread over the
  # other shards, and the rest by their places in the list: a new test is in some shard whatever its name.
  # The jobs `dart` and `rust` run these lines too (`run: *shard`), for the tests that need their extractor only: ONLY is set
  # there, and the heavy tests, which use no extractor, are left to this job (HEAVY is the same list).
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # the job must outlast `go test -timeout 30m` (the dogfood and the curated tests on a loaded runner)
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test cmd/rivus (one shard of five)
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: "5"
          # the heavy tests that need no extractor, the heaviest first
          HEAVY: &heavy TestDeterministicDogfood TestDeterministicParamshare TestGCPRows TestDogfood TestDeterministicPassStats TestDeterministicCuratedGo TestScaleSynth
          # a missing module cache of bench/gcp fails the Google Cloud gate, and does not skip it
          RIVUS_REQUIRE_GCP: "1"
        run: &shard |
          all=$(go test -list '.' ./cmd/rivus | grep -E '^(Test|Example)' | LC_ALL=C sort)
          names=$(echo "$all" | awk -v i="$SHARD_INDEX" -v n="$SHARD_TOTAL" -v heavy="$HEAVY" -v only="${ONLY:-}" '
            BEGIN { split(heavy, h, " "); for (k = 1; k in h; k++) rank[h[k]] = k - 1; lone = (only == "" && n > 1) }
            $0 in rank {
              if (only != "") next
              s = (!lone) ? rank[$0] % n : (rank[$0] == 0 ? 0 : 1 + (rank[$0] - 1) % (n - 1))
              if (s == i) print
              next
            }
            { s = lone ? 1 + (r++ % (n - 1)) : (r++ % n); if (s == i) print }')
          if [ -z "$names" ]; then
            echo "shard $SHARD_INDEX/$SHARD_TOTAL has no test" >&2
            exit 1
          fi
          echo "shard $SHARD_INDEX/$SHARD_TOTAL: $(echo "$names" | wc -l | tr -d ' ') tests"
          regex="^($(echo "$names" | paste -sd'|' -))\$"
          go test ${SHORT:+"$SHORT"} -timeout 30m -run "$regex" ./cmd/rivus

  # The tools of the bench (the comparison, the backtest, the ledger) have their own job: a red `test` job must not keep
  # them from running (they were the last step of it, and did not run while it was red). Python only, no build.
  bench-tools:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the comparison tool
        run: python3 bench/test_compare.py
      - name: Test the backtest and the ledger tools
        run: python3 bench/test_backtest.py

  # The Dart extractor reads the code with package:analyzer; its tests (and the curated bench) need the Dart
  # SDK and each sample package's `dart pub get`. They are skipped when RIVUS_DART is not set.
  dart:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: 3.13.6
      - name: Write the generated files of the Dart zoo
        # the two pubspec.yaml of the zoo (cells, exec) and exec/lib/cases.dart are made from the directories of the cells and of the skeleton packages:
        # they are not committed, and `dart pub get` and `dart analyze` need them first
        run: make zoo-dart-gen
      - name: Resolve the packages of the extractor and the samples
        # every one of them has a pubspec.lock (the versions are the locked ones, or the step fails), but the two of the Dart zoo
        # (bench/zoo-dart/cells, bench/zoo-dart/exec): those are not committed (written above), and `dart pub get` makes the lock
        run: |
          for d in extractor/dart extractor/dart/test/sample extractor/dart/test/monorepo/app extractor/dart/test/monorepo/shared extractor/dart/test/versions/a extractor/dart/test/versions/b bench/dart-curated; do
            if [ -f "$d/pubspec.yaml" ]; then
              (cd "$d" && dart pub get --enforce-lockfile)
            fi
          done
          for d in bench/zoo-dart/cells bench/zoo-dart/exec; do
            (cd "$d" && dart pub get)
          done
      - name: Analyze the extractor
        if: matrix.shard == 0
        working-directory: extractor/dart
        run: dart analyze lib bin
      - name: Analyze the Dart zoo
        if: matrix.shard == 0
        run: |
          for d in bench/zoo-dart/cells bench/zoo-dart/exec; do
            (cd "$d" && dart analyze)
          done
      - name: Test with the Dart extractor (one shard of five)
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: "5"
          ONLY: "1"
          HEAVY: *heavy
          RIVUS_DART: dart
          # a missing RIVUS_DART fails the tests, and does not skip them
          RIVUS_REQUIRE_DART: "1"
        run: *shard

  # The Rust extractor is built against the compiler's MIR (rustc_public), which is nightly only: it is pinned
  # to one nightly by extractor/rust/rust-toolchain.toml.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the pinned nightly
        working-directory: extractor/rust
        run: rustup toolchain install
      - name: Build the extractor
        working-directory: extractor/rust
        run: cargo build --locked
      - name: Test the extractor
        working-directory: extractor/rust
        run: cargo test --locked
      # The Rust zoo has no dependency (std only, no build.rs, no proc macro): the extractor builds what it reads.
      # The packages of the Rust zoo (bench/zoo-rust-pkg/<package>: a skeleton of an external package, path dependencies only) are found, built and run by
      # TestZooPkgRust in the step below, one after another with one target directory: nothing is listed here, and the time grows by the cells and the skeleton of a package.
      - name: Build the Rust zoo
        working-directory: bench/zoo-rust
        run: cargo build --locked --offline
      - name: Test the harness of the Rust zoo
        working-directory: bench/zoo-rust/exec
        run: cargo test --locked --offline
      - name: Test with the Rust extractor
        run: *shard
        env:
          SHARD_INDEX: "0"
          SHARD_TOTAL: "1"
          ONLY: "1"
          HEAVY: *heavy
          RIVUS_RUST: ${{ github.workspace }}/extractor/rust/target/debug/rivus-rust
          # a missing RIVUS_RUST fails the tests, and does not skip them
          RIVUS_REQUIRE_RUST: "1"

  # bench/gcp run for real, against fakes (exec_test.go): the value of a vulnerable case reaches the SQL text, the
  # value of a fixed one only the parameters. The test refuses every connection that is not loopback.
  gcp-exec:
    needs: changes
    # the cases run for real: main, once a week, and the release pull request of tagpr (a pull request runs the tests with -short)
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'tagpr-from-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test the cases by running them
        working-directory: bench/gcp
        run: go test -tags gcpexec -timeout 10m ./...

  # A mark that loosens the truth of the zoo (a row added to a cell that bench/zoo/marks.d already has a file of, or a row of a new cell of
  # a kind other than @sink(none), @miss and @fp; against the merge base) needs a "Zoo-Loosened:" line in a commit message (the
  # user's approval); a new @miss or @fp row needs an @ref(#N) or @ref(model-<package>-<name>) whose file is in docs/issues. TestZooMarksLock (in the shards of the test job) holds the file to the sources.
  zoo-loosened:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: make zoo-loosened BASE="$BASE" HEAD="$HEAD_SHA"

  # The tests of the sandbox of macOS (internal/sandbox, docs/DESIGN-macos-sandbox.md) on a runner of macOS. They run when something that
  # the isolation is made of changes, and once a week (the sandbox and its profile can break when macOS or Xcode is updated, with no change
  # of the code).
  #
  # Only the tests that need no toolchain: what the probe cannot do under the sandbox, the ways out that are closed, the limits. The
  # extraction of Rust under the sandbox (the toolchain, the fetch) is tried on the machine of the developer (RIVUS_SBX_RED=1, RIVUS_SBX_NET=1).
  sandbox:
    needs: changes
    if: needs.changes.outputs.isolation == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test the sandbox
        env:
          # the tests make harmless marks outside the sandbox when it does not hold (a name rivus-sbx-<id>, removed after), and say so
          RIVUS_SBX_RED: "1"
        run: go test -count=1 -timeout 20m -run 'TestSandbox(Stops|Closes|Time|Output|Environment|Unavailable|Stderr|Program)' ./internal/sandbox

  # The differential test of the models (bench/model-diff, docs/MODEL-RUNBOOK.md): a package at a time, its model against its body. Only the
  # weekly run and a run by hand, and it reports without blocking (`continue-on-error`) until it has been run for a while; it is not in a pull request
  # (the plan for that: docs/DESIGN-package-models.md, 7). Go and Dart only: a Rust crate is built to be read, and that needs the isolation.
  model-diff:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg: [strings, path/filepath, encoding/json, net/url, bytes, strconv, "package:http"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: 3.13.6
      - name: Check the model of the package
        env:
          PKG: ${{ matrix.pkg }}
          RIVUS_DART: dart
        run: make model-diff PKG="$PKG"

  # The one check that a ruleset requires. Every job above is in `needs`: it fails when one of them failed or was cancelled, and passes
  # when they passed or were skipped (nothing that a test reads changed). A job added above has to be added here.
  ci-ok:
    if: always()
    needs: [changes, go-packages, test, bench-tools, dart, rust, gcp-exec, zoo-loosened, sandbox, model-diff]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Look at the jobs
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # `changes` has to have answered: a skipped heavy job is only a pass when it was skipped on an answer
          echo "$NEEDS" | jq -e '.changes.result == "success" and (.changes.outputs.code | IN("true", "false")) and (.changes.outputs.isolation | IN("true", "false")) and (.changes.outputs.dart | IN("true", "false")) and (.changes.outputs.rust | IN("true", "false"))' > /dev/null
          echo "$NEEDS" | jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' > /dev/null
