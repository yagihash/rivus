# beego (github.com/astaxie/beego v1; the same package path in beego/beego v1.12): a controller embeds
# beego.Controller, and what the request holds is read through its getters. The type that the project's
# controllers share (Casdoor: ApiController) is the project's own wrapper: it has to be named as a source in
# the project's rules (see bench/wild/go/GHSA-9vm3-r8gq-cr6x/rules.yaml), as with macaron.
# This file is the part that is the same in every project: the getters, and the sinks of the controller.
ruleset: example/go/beego@1

sources:
  - kind: param_type
    type: "*github.com/astaxie/beego.Controller"
    labels: [user_input]

propagators:
  - symbol: (*github.com/astaxie/beego.Controller).Input
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/astaxie/beego.Controller).GetString
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/astaxie/beego.Controller).GetStrings
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/astaxie/beego.Controller).GetFile
    flows: [{from: recv, to: result0}]
  - symbol: (*github.com/astaxie/beego.Controller).GetFiles
    flows: [{from: recv, to: result0}]
  - symbol: (*github.com/astaxie/beego.Controller).ParseForm
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/astaxie/beego/context.BeegoInput).Query
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/astaxie/beego/context.BeegoInput).Param
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/astaxie/beego/context.BeegoInput).Header
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/astaxie/beego/context.BeegoInput).Cookie
    flows: [{from: recv, to: result}]

sinks:
  - symbol: (*github.com/astaxie/beego.Controller).Redirect
    args: [0]
    category: open_redirect
  - symbol: (*github.com/astaxie/beego.Controller).SaveToFile
    args: [1]
    category: path_traversal
