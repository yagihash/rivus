# A project that is hostile on purpose: its build script and its proc macro try to read what is not the project,
# to reach a network, to write outside, and to read the environment. It is a test of the isolation of the Rust
# extractor (docs/rust-isolation.md). It is only ever built in the container: the marker file .rivus-hostile makes
# rivus refuse it on this machine, and build.rs does nothing outside the image.
[package]
name = "hostile"
version = "0.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
hostile-macros = { path = "macros" }

[workspace]
