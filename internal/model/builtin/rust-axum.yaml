# axum: the web framework (crate `axum`, 0.8). Where untrusted requests come from: the extractors that carry what the client
# wrote are sources, as the types of the parameters of a handler. Not sources (ADR-108: who wrote the value): State (the
# application's own value), Extension (set by a layer of the application), MatchedPath (the route pattern, written by the
# application), ConnectInfo (the address of the peer, a narrow value).
# `axum::extract::Request` is an alias of http::Request<Body>, and the extractor writes it `axum::http::Request`.
# The response that redirects to a place the client chose (open redirect) is a sink. The argument is the first of an associated
# function (no receiver). `Html(..)` is the constructor of a tuple struct and is no call: it has no row.
# It was a part of rust-web.yaml; the other web frameworks are still there.
ruleset: rivus/rust/axum@1

verified_versions:
  - package: axum
    versions: ">=0.8.0 <0.9.0"
    checked_with: 0.8.9
    checked: 2026-11-23

sources:
  - kind: param_type
    type: "axum::extract::Query"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Path"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Json"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Form"
    labels: [user_input]
  - kind: param_type
    type: "axum::body::Bytes"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::RawQuery"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::RawForm"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Multipart"
    labels: [user_input]
  - kind: param_type
    type: "axum::http::Uri"
    labels: [user_input]
  - kind: param_type
    type: "axum::http::HeaderMap"
    labels: [user_input]
  - kind: param_type
    type: "&axum::http::HeaderMap"
    labels: [user_input]
  - kind: param_type
    type: "axum::http::Request"
    labels: [user_input]
  - kind: param_type
    type: "&axum::http::Request"
    labels: [user_input]
  - kind: param_type
    type: "axum::http::request::Parts"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::OriginalUri"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::RawPathParams"
    labels: [user_input]
  - kind: param_type
    type: "axum::body::Body"
    labels: [user_input]

sinks:
  - symbol: axum::response::Redirect::to
    args: [0]
    category: open_redirect
    accepts: [user_input]
  - symbol: axum::response::Redirect::temporary
    args: [0]
    category: open_redirect
    accepts: [user_input]
  - symbol: axum::response::Redirect::permanent
    args: [0]
    category: open_redirect
    accepts: [user_input]
