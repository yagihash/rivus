  - symbol: std::result::Result::unwrap_err
    flows: [{from: args, to: result}]
  - symbol: std::result::Result::expect_err
    flows: [{from: args, to: result}]
  - symbol: std::iter::Iterator::unzip
    flows: [{from: args, to: result}]
  - symbol: std::iter::Iterator::rposition
    flows: [{from: args, to: result}]
  - symbol: std::iter::Iterator::max_by_key
    flows: [{from: args, to: result}]
  - symbol: std::iter::Iterator::min_by_key
    flows: [{from: args, to: result}]
  - symbol: std::iter::Iterator::sum
    flows: [{from: args, to: result}]
  - symbol: std::iter::Iterator::product
