    flows: [{from: arg1, to: arg0}, {from: arg2, to: arg0}]
  - symbol: tokio::io::AsyncWriteExt::write_all
    flows: [{from: arg1, to: arg0}]
  - symbol: tokio::io::AsyncWriteExt::write
    flows: [{from: arg1, to: arg0}]
  - symbol: tokio::io::AsyncReadExt::read_to_string
    flows: [{from: arg0, to: arg1}]
  - symbol: tokio::io::AsyncReadExt::read_to_end
    flows: [{from: arg0, to: arg1}]
  - symbol: tokio::io::AsyncReadExt::read
    flows: [{from: arg0, to: arg1}]
  - symbol: tokio::sync::mpsc::Sender::send
    flows: [{from: arg1, to: arg0}]
  - symbol: tokio::sync::mpsc::Receiver::recv
    flows: [{from: arg0, to: result}]
  - symbol: tokio::sync::oneshot::Sender::send
    flows: [{from: arg1, to: arg0}]
