# More of Rust, found by "rivus models coverage" on a real program (a browser
# automation CLI, 148,000 lines): formatting machinery, serde, tokio, futures.
ruleset: rivus/rust/misc@1

propagators:
  - symbol: std::future::Future::poll
    flows: [{from: args, to: result}]
  - symbol: futures_util::Future::poll
    flows: [{from: args, to: result}]
  - symbol: std::task::Poll::Ready
    flows: [{from: args, to: result}]
  - symbol: serde_json::to_value
    flows: [{from: args, to: result}]
  - symbol: serde_json::to_string_pretty
    flows: [{from: args, to: result}]
  - symbol: serde_json::to_writer
    flows: [{from: args, to: result}]
  - symbol: serde_json::from_reader
    flows: [{from: args, to: result}]
  - symbol: serde_json::Map::new
    flows: [{from: args, to: result}]
  - symbol: serde_json::Value::as_bool
    flows: [{from: args, to: result}]
  - symbol: serde_json::Value::as_f64
    flows: [{from: args, to: result}]
  - symbol: serde_json::Value::as_i64
    flows: [{from: args, to: result}]
  - symbol: serde_json::Value::as_u64
    flows: [{from: args, to: result}]
  - symbol: serde_json::Value::as_array
    flows: [{from: args, to: result}]
  - symbol: serde_json::Value::as_object
    flows: [{from: args, to: result}]
  - symbol: serde_json::Value::as_str
    flows: [{from: args, to: result}]
  - symbol: serde_json::Value::get
    flows: [{from: args, to: result}]
  - symbol: serde_json::Value::pointer
    flows: [{from: args, to: result}]
  - symbol: serde::__private::from_utf8_lossy
    flows: [{from: args, to: result}]
  - symbol: std::str::to_ascii_lowercase
    flows: [{from: args, to: result}]
  - symbol: std::str::to_ascii_uppercase
    flows: [{from: args, to: result}]
  - symbol: std::string::String::to_ascii_lowercase
    flows: [{from: args, to: result}]
  - symbol: std::option::Option::is_some_and
    flows: [{from: args, to: result}]
  - symbol: std::option::Option::map_or
    flows: [{from: args, to: result}]
  - symbol: std::option::Option::map_or_else
    flows: [{from: args, to: result}]
