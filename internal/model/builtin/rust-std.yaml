# The Rust standard library: where untrusted data comes from, how it moves
# through strings, options, results and collections, and the dangerous
# operations. The symbols are what the extractor writes: the path of the
# function, or of the trait method (std::ops::Deref::deref), without generics.
# The receiver is the first argument: arg0.
ruleset: rivus/rust/std@1
read_impls: true   # the methods of traits are also implemented by the code of the project

sources:
  - symbol: std::env::args
    labels: [user_input]
  - symbol: std::io::stdin
    labels: [user_input]
  - symbol: std::fs::read_to_string
    labels: [file_content]
  - symbol: std::fs::read
    labels: [file_content]

propagators:
  # a function that calls what it is given (docs/MODELING.md): Once::call_once runs its closure; for the callbacks
  # that std hands what the receiver holds (Option::map, Iterator::for_each) the rows say it, beside the flows
  - symbol: std::sync::Once::call_once
    pure: true
    calls: [{fn: arg1}]
  # conversions and views: the result is made of the argument
  - symbol: std::convert::From::from
    flows: [{from: args, to: result}]
  - symbol: std::convert::Into::into
    flows: [{from: args, to: result}]
  - symbol: std::convert::TryFrom::try_from
    flows: [{from: args, to: result}]
  - symbol: std::convert::TryInto::try_into
    flows: [{from: args, to: result}]
  - symbol: std::string::ToString::to_string
    flows: [{from: args, to: result}]
