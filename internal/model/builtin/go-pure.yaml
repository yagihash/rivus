# Functions through which no taint flows: locks, clocks, logging, predicates.
# Saying so removes the conservative guess (everything that goes in may come
# out) and the uncertainty that guess would leave on every path.
ruleset: rivus/go/pure@1

propagators:
  # sync
  - symbol: (*sync.Mutex).Lock
    pure: true
  - symbol: (*sync.Mutex).Unlock
    pure: true
  - symbol: (*sync.Mutex).TryLock
    pure: true
  - symbol: (*sync.RWMutex).Lock
    pure: true
  - symbol: (*sync.RWMutex).Unlock
    pure: true
  - symbol: (*sync.RWMutex).RLock
    pure: true
  - symbol: (*sync.RWMutex).RUnlock
    pure: true
  - symbol: (*sync.WaitGroup).Add
    pure: true
  - symbol: (*sync.WaitGroup).Done
    pure: true
  - symbol: (*sync.WaitGroup).Wait
    pure: true
  - symbol: (sync.Locker).Lock
    pure: true
  - symbol: (sync.Locker).Unlock
    pure: true

  # time
  - symbol: time.Now
    pure: true
  - symbol: time.Since
    pure: true
  - symbol: time.Until
    pure: true
  - symbol: time.Sleep
    pure: true
  - symbol: (time.Time).Add
    pure: true
  - symbol: (time.Time).Sub
    pure: true
  - symbol: (time.Time).After
    pure: true
  - symbol: (time.Time).Before
    pure: true
  - symbol: (time.Time).Equal
    pure: true
  - symbol: (time.Time).IsZero
    pure: true
  - symbol: (time.Time).Unix
    pure: true
  - symbol: (time.Time).UTC
    pure: true

  # logging: output is not modelled as a sink; nothing flows back
  - symbol: log.Printf
    pure: true
  - symbol: log.Println
    pure: true
  - symbol: log.Print
    pure: true
  - symbol: log.Fatalf
    pure: true
  - symbol: log.Fatal
    pure: true
  - symbol: log.Panicf
    pure: true

  # predicates and in-place helpers
  - symbol: strings.HasPrefix
    pure: true
  - symbol: strings.HasSuffix
    pure: true
  - symbol: strings.Contains
    pure: true
  - symbol: strings.EqualFold
    pure: true
  - symbol: strings.Index
    pure: true
  - symbol: strings.Count
    pure: true
  - symbol: bytes.Equal
    pure: true
  - symbol: sort.Strings
    pure: true
  - symbol: sort.Ints
    pure: true
  - symbol: sort.Slice
    pure: true
  - symbol: errors.Is
    pure: true
  - symbol: (io.Closer).Close
    pure: true
  - symbol: (net/http.ResponseWriter).WriteHeader
    pure: true
  - symbol: (context.Context).Done
    pure: true
  - symbol: (context.Context).Err
    pure: true
  - symbol: (*net/http.Client).CloseIdleConnections
    pure: true
  # methods of standard interfaces, whose implementations are outside the code
  - symbol: (io/fs.FileInfo).IsDir
    pure: true
  - symbol: (io/fs.FileInfo).Size
    pure: true
  - symbol: (io/fs.FileInfo).ModTime
    pure: true
  - symbol: (io/fs.FileInfo).Mode
    pure: true
  - symbol: (io/fs.DirEntry).IsDir
    pure: true
  - symbol: (io/fs.DirEntry).Type
    pure: true
  - symbol: (reflect.Type).Elem
    pure: true
  - symbol: (reflect.Type).Kind
    pure: true
  - symbol: (reflect.Type).NumField
    pure: true
  - symbol: (reflect.Type).Name
    pure: true
  - symbol: (testing.TB).Fatalf
    pure: true
  - symbol: (testing.TB).Errorf
    pure: true
  - symbol: (testing.TB).Logf
    pure: true
  - symbol: (testing.TB).Helper
    pure: true
  - symbol: (crypto/cipher.AEAD).NonceSize
    pure: true
  - symbol: (crypto/cipher.AEAD).Overhead
    pure: true
  - symbol: (hash.Hash).Reset
    pure: true
  - symbol: (hash.Hash).Size
    pure: true
  # standard functions the benchmarks call and nothing said what they do
  - symbol: context.TODO
    pure: true
  - symbol: context.Background
    pure: true
  - symbol: time.Unix
    pure: true
  - symbol: (time.Time).Local
    pure: true
  - symbol: (time.Time).Format
    pure: true
  - symbol: (time.Time).UnixNano
    pure: true
  - symbol: (time.Time).Year
    pure: true
  - symbol: (time.Time).Nanosecond
    pure: true
  - symbol: time.ParseInLocation
    pure: true
  - symbol: (*os.File).Close
    pure: true
  - symbol: os.TempDir
    pure: true
  - symbol: bytes.Index
    pure: true
  - symbol: bytes.HasPrefix
    pure: true
  - symbol: strings.ContainsAny
    pure: true
  - symbol: strings.IndexByte
    pure: true
  - symbol: net/http.DetectContentType
    pure: true
  - symbol: (*bufio.Scanner).Scan
    pure: true
  - symbol: (*database/sql.DB).Close
    pure: true
  - symbol: (*database/sql.Rows).Close
    pure: true
  - symbol: (*database/sql.Rows).Next
    pure: true
  - symbol: (*database/sql.Rows).Err
    pure: true
  - symbol: (*os/exec.Cmd).Run
    pure: true
  - symbol: (*os/exec.Cmd).Start
    pure: true
  - symbol: (*os/exec.Cmd).Wait
    pure: true
  - symbol: os/exec.LookPath
    pure: true
  - symbol: os.Stat
    pure: true
  - symbol: (*regexp.Regexp).MatchString
    pure: true
  - symbol: (*net/smtp.Client).Extension
    pure: true
  - symbol: strconv.FormatInt
    pure: true
  - symbol: strings.Title
    flows: [{from: arg0, to: result}]
  - symbol: bytes.ReplaceAll
    flows: [{from: arg0, to: result}]
  - symbol: strings.TrimRightFunc
    flows: [{from: arg0, to: result}]
  - symbol: path/filepath.Ext
    flows: [{from: arg0, to: result}]
  - symbol: io.NopCloser
    flows: [{from: arg0, to: result}]
  - symbol: (*net/url.URL).Hostname
    flows: [{from: recv, to: result}]
  - symbol: (embed.FS).ReadFile
    flows: [{from: recv, to: result0}]
  - symbol: (*os.File).WriteString
    pure: true
  - symbol: (*os.File).Write
    pure: true
  - symbol: strconv.ParseInt
    flows: [{from: arg0, to: result0}]
