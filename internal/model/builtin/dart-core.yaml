sanitizers:
  # percent encoding makes a value safe in a URL
  - symbol: dart:core#Uri.encodeComponent
    drops: [user_input]
    adds: [url_encoded]
  - symbol: dart:core#Uri.encodeFull
    drops: [user_input]
    adds: [url_encoded]
  - symbol: dart:core#Uri.encodeQueryComponent
    drops: [user_input]
    adds: [url_encoded]
  # HTML escaping
  - symbol: dart:convert#HtmlEscape.convert
    drops: [user_input]
    adds: [html_escaped]
