# dart:core and dart:convert: how data moves through strings, URIs, lists and
# maps. Symbols are "<library uri>#<Type>.<member>" (extractor/dart/README.md).
ruleset: rivus/dart/core@1

propagators:
  # functions that call a function they are given: forEach and listen deliver what the receiver holds
  - symbol: dart:core#Iterable.forEach
    pure: true
    calls: [{fn: arg0, with: [recv]}]
  - symbol: dart:core#Map.forEach
    pure: true
    calls: [{fn: arg0, with: [recv, recv]}]
  # a method of a dynamic value: the extractor does not know which, and says that what it
  # returns may come from the receiver and from the arguments (the receiver is the first)
  - symbol: dart:core#dynamic.invoke
    flows: [{from: args, to: result}]
  # strings: the result is made of the receiver (and the arguments)
  - symbol: dart:core#String.trim
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:core#String.trimLeft
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:core#String.trimRight
