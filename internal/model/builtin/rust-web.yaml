    labels: [user_input]
  - kind: param_type
    type: "actix_web::web::Json"
    labels: [user_input]
  - kind: param_type
    type: "actix_web::web::Form"
    labels: [user_input]
  - kind: param_type
    type: "actix_web::web::Bytes"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Query"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Path"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Json"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Form"
    labels: [user_input]
  - kind: param_type
    type: "axum::body::Bytes"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::RawQuery"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::RawForm"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Multipart"
    labels: [user_input]
  - kind: param_type
    type: "axum::http::Uri"
    labels: [user_input]
  - kind: param_type
    type: "http::request::Request"
    labels: [user_input]
  - kind: param_type
    type: "&http::request::Request"
    labels: [user_input]
  - kind: param_type
    type: "http::Uri"
    labels: [user_input]
  - kind: param_type
    type: "hyper::Request"
    labels: [user_input]
  - kind: param_type
    type: "rocket::Request"
    labels: [user_input]
  - kind: param_type
    type: "&rocket::Request"
