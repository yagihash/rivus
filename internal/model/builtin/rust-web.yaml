# Web frameworks and HTTP clients: the request a handler is given is attacker
# controlled. The types are the paths of the structs (without type arguments),
# `&` kept.
ruleset: rivus/rust/web@1

sources:
  - kind: param_type
    type: "actix_web::HttpRequest"
    labels: [user_input]
  - kind: param_type
    type: "&actix_web::HttpRequest"
    labels: [user_input]
  - kind: param_type
    type: "actix_web::web::Query"
    labels: [user_input]
  - kind: param_type
