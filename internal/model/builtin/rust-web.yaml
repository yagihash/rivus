# Web frameworks and HTTP clients: the request a handler is given is attacker
# controlled. The types are the paths of the structs (without type arguments), `&` kept.
# actix-web has its own file: rust-actix-web.yaml.
ruleset: rivus/rust/web@1

sources:
  - kind: param_type
    type: "axum::extract::Query"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Path"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Json"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Form"
    labels: [user_input]
  - kind: param_type
    type: "axum::body::Bytes"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::RawQuery"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::RawForm"
    labels: [user_input]
  - kind: param_type
    type: "axum::extract::Multipart"
    labels: [user_input]
  - kind: param_type
    type: "axum::http::Uri"
    labels: [user_input]
  - kind: param_type
    type: "http::request::Request"
    labels: [user_input]
  - kind: param_type
    type: "&http::request::Request"
    labels: [user_input]
  - kind: param_type
    type: "http::Uri"
    labels: [user_input]
  - kind: param_type
    type: "hyper::Request"
    labels: [user_input]
  - kind: param_type
    type: "rocket::Request"
    labels: [user_input]
  - kind: param_type
    type: "&rocket::Request"
    labels: [user_input]
  - kind: param_type
    type: "tide::Request"
    labels: [user_input]
  - kind: param_type
    type: "rouille::Request"
    labels: [user_input]
  - kind: param_type
    type: "&rouille::Request"
    labels: [user_input]
  - kind: param_type
    type: "warp::filters::query::Query"
    labels: [user_input]

propagators:
  - symbol: http::request::Request::uri
    flows: [{from: args, to: result}]
  - symbol: http::request::Request::headers
    flows: [{from: args, to: result}]
  - symbol: http::request::Request::body
    flows: [{from: args, to: result}]
  - symbol: http::request::Request::into_body
    flows: [{from: args, to: result}]
  - symbol: http::request::Request::into_parts
    flows: [{from: args, to: result}]
  - symbol: http::Uri::path
    flows: [{from: args, to: result}]
  - symbol: http::Uri::query
    flows: [{from: args, to: result}]
  - symbol: http::Uri::host
    flows: [{from: args, to: result}]
  - symbol: http::Uri::to_string
    flows: [{from: args, to: result}]
  - symbol: http::HeaderMap::get
    flows: [{from: args, to: result}]
  - symbol: http::HeaderValue::to_str
    flows: [{from: args, to: result}]
  - symbol: http::HeaderValue::as_bytes
    flows: [{from: args, to: result}]
  - symbol: url::Url::parse
    flows: [{from: args, to: result}]
  - symbol: url::Url::path
    flows: [{from: args, to: result}]
  - symbol: url::Url::query
    flows: [{from: args, to: result}]
  - symbol: url::Url::query_pairs
    flows: [{from: args, to: result}]
  - symbol: url::Url::host_str
    flows: [{from: args, to: result}]
  - symbol: url::Url::as_str
    flows: [{from: args, to: result}]
  - symbol: url::Url::join
    flows: [{from: args, to: result}]
  - symbol: serde_json::from_str
    flows: [{from: args, to: result}]
  - symbol: serde_json::from_slice
    flows: [{from: args, to: result}]
  - symbol: serde_json::from_value
    flows: [{from: args, to: result}]
  - symbol: serde_json::to_string
    flows: [{from: args, to: result}]
  - symbol: serde_json::to_vec
    flows: [{from: args, to: result}]
  - symbol: serde_json::Value::as_str
    flows: [{from: args, to: result}]
  - symbol: serde_json::Value::get
    flows: [{from: args, to: result}]
  - symbol: serde_json::Map::get
    flows: [{from: args, to: result}]
  - symbol: serde_urlencoded::from_str
    flows: [{from: args, to: result}]
  - symbol: serde_urlencoded::to_string
    flows: [{from: args, to: result}]
  - symbol: urlencoding::decode
    flows: [{from: args, to: result}]
