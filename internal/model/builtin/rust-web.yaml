# Web frameworks other than axum and actix-web (hyper, rocket, tide, rouille, warp): the request a handler is given is attacker
# controlled. The types are the paths of the structs (without type arguments), `&` kept.
# actix-web and axum have their own files: rust-actix-web.yaml, rust-axum.yaml.
ruleset: rivus/rust/web@1

sources:
  - kind: param_type
    type: "hyper::Request"
    labels: [user_input]
  - kind: param_type
    type: "rocket::Request"
    labels: [user_input]
  - kind: param_type
    type: "&rocket::Request"
    labels: [user_input]
  - kind: param_type
    type: "tide::Request"
    labels: [user_input]
  - kind: param_type
    type: "rouille::Request"
    labels: [user_input]
  - kind: param_type
    type: "&rouille::Request"
    labels: [user_input]
  - kind: param_type
    type: "warp::filters::query::Query"
    labels: [user_input]
