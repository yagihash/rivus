# package:shelf and package:sqflite: the common server side libraries (package:http is in dart-http.yaml).
#
# shelf: the `Request` is the source (`param_type`) and its getters are flows. The sinks are on `Response` (checked against shelf 1.4.3,
# range >=1.4.0 <2.0.0, 2026-11-23, by reading the published source; hand written rows, origin: human; the generator does not exist yet):
# the body of a response (`xss`, as `net/http.ResponseWriter.Write` is in go-net-http.yaml: shelf does not escape, the content type is
# the caller's), and the `location` of the three redirect constructors (`open_redirect`). `Response.change(body:)` is the same body.
# Content type (shelf 1.4.3, message.dart): a `String` body gets no `content-type` of its own (only a body whose encoding differs from the
# header's gets `application/octet-stream; charset=...` when the caller gave none); the caller sets it with `headers:`. The row does not
# look at the headers: it is the same as `(net/http.ResponseWriter).Write` in go-net-http.yaml (category `xss`, `accepts: [user_input]`,
# no distinction by content type), so a body that the caller sends as text/plain or JSON is a sink as well (a known noise of the row).
# `Handler` and `Middleware` (`Pipeline`, `Cascade`, `createMiddleware`) have no row on purpose: a handler is a function value that
# the project's own code builds, and the few lines of `Pipeline.addHandler` and `Cascade.handler` are read as a dependency (a row
# would cut the call from a middleware to the handler it wraps: ADR-092). `calls:` rows: none (the request reaches a handler
# through `param_type`, not through a call of the package).
# model-diff: value Request Request('GET', Uri.parse('http://localhost/'))
# model-diff: value Response Response(200)
ruleset: rivus/dart/packages@1

verified_versions:
  - package: shelf
    versions: ">=1.4.0 <2.0.0"
    checked_with: 1.4.3
    checked: 2026-11-23

sources:
  - kind: param_type
    type: "package:shelf/src/request.dart#Request"
    labels: [user_input]

propagators:
  - symbol: package:shelf/src/request.dart#Request.url
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.requestedUri
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.headers
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.headersAll
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.context
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.method
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.handlerPath
    flows: [{from: recv, to: result}]
  # change(headers:, context:, path:, body:): the new request is made of the old one and of what is given (`handlerPath += path`, `body`, the headers and the
  # context merged in), as shelf 1.4.3 lib/src/request.dart `Request.change` shows. A flow cannot name a named argument (#145): `args`.
  - symbol: package:shelf/src/request.dart#Request.change
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: package:shelf/src/request.dart#Request.read
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.readAsString
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.encoding
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.mimeType
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.contentLength
    flows: [{from: recv, to: result}]

sinks:
  # shelf: the body of a response (the content type is the caller's; the body is not escaped)
  - symbol: package:shelf/src/response.dart#Response.new
    named: [body]
    category: xss
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.ok
    args: [0]
    category: xss
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.change
    named: [body]
    category: xss
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.movedPermanently
    args: [0]
    category: open_redirect
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.movedPermanently
    named: [body]
    category: xss
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.found
    args: [0]
    category: open_redirect
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.found
    named: [body]
    category: xss
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.seeOther
    args: [0]
    category: open_redirect
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.seeOther
    named: [body]
    category: xss
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.badRequest
    named: [body]
    category: xss
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.unauthorized
    args: [0]
    category: xss
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.forbidden
    args: [0]
    category: xss
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.notFound
    args: [0]
    category: xss
    accepts: [user_input]
  - symbol: package:shelf/src/response.dart#Response.internalServerError
    named: [body]
    category: xss
    accepts: [user_input]
  # SQL injection: only the query text is dangerous, not the bound arguments
  - symbol: package:sqflite_common/src/database_mixin.dart#SqfliteDatabaseMixin.rawQuery
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/src/database_mixin.dart#SqfliteDatabaseMixin.rawInsert
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/src/database_mixin.dart#SqfliteDatabaseMixin.rawUpdate
    args: [0]
