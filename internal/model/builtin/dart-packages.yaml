    accepts: [user_input]
  - symbol: package:sqflite_common/src/database_mixin.dart#SqfliteDatabaseMixin.rawDelete
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/src/database_mixin.dart#SqfliteDatabaseMixin.execute
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/sqlite_api.dart#DatabaseExecutor.rawQuery
    args: [0]
