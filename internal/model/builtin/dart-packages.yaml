# package:shelf and package:sqflite: the common server side libraries (package:http is in dart-http.yaml).
ruleset: rivus/dart/packages@1

sources:
  - kind: param_type
    type: "package:shelf/src/request.dart#Request"
    labels: [user_input]

propagators:
  - symbol: package:shelf/src/request.dart#Request.url
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.requestedUri
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.headers
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.headersAll
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.context
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.method
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.handlerPath
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.change
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.read
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.readAsString
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.encoding
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.mimeType
    flows: [{from: recv, to: result}]
  - symbol: package:shelf/src/request.dart#Request.contentLength
    flows: [{from: recv, to: result}]

sinks:
  # SQL injection: only the query text is dangerous, not the bound arguments
  - symbol: package:sqflite_common/src/database_mixin.dart#SqfliteDatabaseMixin.rawQuery
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/src/database_mixin.dart#SqfliteDatabaseMixin.rawInsert
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/src/database_mixin.dart#SqfliteDatabaseMixin.rawUpdate
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/src/database_mixin.dart#SqfliteDatabaseMixin.rawDelete
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/src/database_mixin.dart#SqfliteDatabaseMixin.execute
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/sqlite_api.dart#DatabaseExecutor.rawQuery
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/sqlite_api.dart#DatabaseExecutor.rawInsert
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/sqlite_api.dart#DatabaseExecutor.rawUpdate
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/sqlite_api.dart#DatabaseExecutor.rawDelete
    args: [0]
    category: sql_injection
    accepts: [user_input]
  - symbol: package:sqflite_common/sqlite_api.dart#DatabaseExecutor.execute
    args: [0]
    category: sql_injection
    accepts: [user_input]
