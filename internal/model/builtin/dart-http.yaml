# package:http: the HTTP client of the Dart team (the `Client` interface, `BaseClient`, the functions of `http.dart`).
#
# The URL that a request goes to is an SSRF sink; the result of a request is what the arguments flow to (as
# `(*net/http.Client).Do` and `dart:io` `HttpClient` do: the response is not a source, the server is not an
# attacker of the program). The body and the headers of a request are not sinks (nothing in `net/http` or
# `dart:io` says they are either).
#
# `Client` is an interface that many classes implement and that call each other (`IOClient`, `RetryClient`,
# the authenticated clients of googleapis_auth, ...). A row on the interface method stands for the
# implementations of the packages: a call through the interface does not read them (a note says so:
# `dependency_body_unread`), and the implementations that the project writes itself are still read.
# What is not followed: what a convenience method (`get`, `post`, ...) hands to the `send` of a class of the
# project, and the callbacks that the project gives to an implementation of a package (`RetryClient(when:)`).
# `BaseClient` has the rows too, for a call on a variable that is typed `IOClient` or `RetryClient` (the call is of the
# method of `BaseClient`); a call through `Client` that reaches `BaseClient.get` then has two findings (the interface and the
# implementation, ADR-068). The `send` of `IOClient` and `RetryClient` has no row: only a call on a variable of that
# type is missed.
# docs/DESIGN-deps-cost.md, section 11.
ruleset: rivus/dart/http@1

propagators:
  - symbol: package:http/src/response.dart#Response.body
    flows: [{from: recv, to: result}]
  - symbol: package:http/src/response.dart#Response.bodyBytes
    flows: [{from: recv, to: result}]
  - symbol: package:http/src/response.dart#Response.headers
    flows: [{from: recv, to: result}]
  - symbol: package:http/src/base_response.dart#BaseResponse.headers
    flows: [{from: recv, to: result}]
  - symbol: package:http/src/streamed_response.dart#StreamedResponse.stream
    flows: [{from: recv, to: result}]
  - symbol: package:http/src/request.dart#Request.new
    flows: [{from: args, to: result}]
  - symbol: package:http/src/client.dart#Client.head
    flows: [{from: args, to: result}]
  - symbol: package:http/src/client.dart#Client.get
    flows: [{from: args, to: result}]
  - symbol: package:http/src/client.dart#Client.post
    flows: [{from: args, to: result}]
  - symbol: package:http/src/client.dart#Client.put
    flows: [{from: args, to: result}]
  - symbol: package:http/src/client.dart#Client.patch
    flows: [{from: args, to: result}]
  - symbol: package:http/src/client.dart#Client.delete
    flows: [{from: args, to: result}]
  - symbol: package:http/src/client.dart#Client.read
    flows: [{from: args, to: result}]
  - symbol: package:http/src/client.dart#Client.readBytes
    flows: [{from: args, to: result}]
  - symbol: package:http/src/base_client.dart#BaseClient.head
    flows: [{from: args, to: result}]
  - symbol: package:http/src/base_client.dart#BaseClient.get
    flows: [{from: args, to: result}]
  - symbol: package:http/src/base_client.dart#BaseClient.post
    flows: [{from: args, to: result}]
  - symbol: package:http/src/base_client.dart#BaseClient.put
    flows: [{from: args, to: result}]
  - symbol: package:http/src/base_client.dart#BaseClient.patch
    flows: [{from: args, to: result}]
  - symbol: package:http/src/base_client.dart#BaseClient.delete
    flows: [{from: args, to: result}]
  - symbol: package:http/src/base_client.dart#BaseClient.read
    flows: [{from: args, to: result}]
  - symbol: package:http/src/base_client.dart#BaseClient.readBytes
    flows: [{from: args, to: result}]
  - symbol: package:http/src/client.dart#Client.send
    flows: [{from: args, to: result}]
  - symbol: package:http/src/base_client.dart#BaseClient.send
    flows: [{from: args, to: result}]
  - symbol: package:http/http.dart#head
    flows: [{from: args, to: result}]
  - symbol: package:http/http.dart#get
    flows: [{from: args, to: result}]
  - symbol: package:http/http.dart#post
    flows: [{from: args, to: result}]
  - symbol: package:http/http.dart#put
    flows: [{from: args, to: result}]
  - symbol: package:http/http.dart#patch
    flows: [{from: args, to: result}]
  - symbol: package:http/http.dart#delete
    flows: [{from: args, to: result}]
  - symbol: package:http/http.dart#read
    flows: [{from: args, to: result}]
  - symbol: package:http/http.dart#readBytes
    flows: [{from: args, to: result}]

