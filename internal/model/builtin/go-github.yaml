# go-github (github.com/google/go-github/v93): the GitHub API client of Go. `Client`, its services (`Repositories`, `Issues`,
# `PullRequests`, `Git`), and the values that come back.
#
# Checked by reading the published source of v93.0.0 (the module proxy), 2026-11-23. Hand written rows (origin: human); the
# generator does not exist yet.
#
# Which major: the module path of go-github has the major in it (`github.com/google/go-github/v93`), and the symbols of the IR
# have it too. The rows are written with `/v*` in place of the major (ADR-110): they apply to every major that a program has.
# The rows were read and checked against the latest major, v93.0.0, and `verified_versions` is the range of that major only
# (`>=93.0.0 <94.0.0`). Only v93 is a target: upstream keeps one branch (master), releases a new major about every month (v82
# to v93 in ten months) and states no support for older majors (README, releases, 2026-11-23). A program that has an older major
# gets the rows too, and `summary.unverified_versions` says that the version was not checked.
#
# The boundary (docs/MODEL-QUEUE.md, row 8):
# * `resource_name`: what decides the resource that a call reaches. go-github has no slug type: the owner and the repository are
#   two plain strings of each call (they are put into the path `repos/<owner>/<repo>/...`), so the rows are on the methods that
#   take them, for the services of repositories, issues, pull requests and git objects. The path, the ref, the sha, the branch, the
#   tag, and the `Ref` of `RepositoryContentGetOptions` are put into the path too. A value of a user there can point to another
#   repository, another file or another ref than the program meant (as the names of the Google Cloud resources: go-gcp.yaml).
#   The ids and numbers (`number int`, `id int64`) are not strings that a user can shape into a path; they are not rows.
# * `Client.NewRequest`, `NewFormRequest`, `NewUploadRequest`: the `urlStr` is put after the base URL (the same category).
#   `WithEnterpriseURLs`: the base URL and the upload URL of the server that the client talks to (`ssrf`).
# * Sources, the criterion (ADR-108): a client of a service makes a value a source when it carries what a user of the service wrote.
#   The sources are the accessors and the fields of the values that come back (the accessors are `call_result` rows, and the
#   fields are `kind: field` rows: a program may read either, `issue.GetBody()` or `*issue.Body`; the rows of the fields fire only
#   in the code of the project, never inside go-github): the text of a file (`RepositoryContent.GetContent` and `.Content`,
#   `DownloadContents*`, `Blob.GetContent` and `.Content`, `GetBlobRaw`), the title and the body of an issue, a pull request, a
#   comment and a review, the message of a commit, the body of a release, and the patch text of a commit or a pull request
#   (`GetCommitRaw`, `GetRaw`; the diff is what the committer wrote). A `Get*` accessor is the same value as its field, so a
#   program is found whichever it reads.
# * Not sources, with the reason (ADR-108, 4 and 5): the ids, the numbers, the times, the shas, the counts, and the URLs that the
#   service builds (`GetHTMLURL`, `GetURL`, `GetDownloadURL`) are decided by the service. The login of a user, the name of a
#   branch (`PullRequestBranch.GetRef`), a label name, the name of a file in a diff (`CommitFile.GetFilename`), the title of a
#   milestone, the description of a repository, the name of a commit's author: written by a user of GitHub, but it is hard to
#   say how far they are shaped by the service (a login is narrow; a branch name and a file name are wide), so they are not made
#   sources (the reviewer can decide them again). The results of `Search.*`, `ListByRepo` and the other lists are values of the
#   types above (their accessors are the sources); the list itself is not.
# * Not modelled: the fields of the request bodies that name a resource (`CreateRef.Ref`, `CreatePullRequest.Head/Base`,
#   `RepositoryContentFileOptions.Branch`, `CommitsListOptions.SHA/Path`); the search queries of `Search.*` (a query is a
#   language of its own); the webhook functions (`ValidatePayload`, `ParseWebHook`: their bodies are read, and the request is
#   already a source by net/http).
# * No `flows` row, no `calls:` row, no `pure` row: the bodies of the services are read (a few lines each: they reach
#   `Client.Do`, which reaches `net/http`, whose rows stand for the clients). `NewRequest` calls the `RequestOption`s that it is
#   given; the package is not declared (`body_replaced_packages`), so the body is read and the callback with it.
ruleset: rivus/go/go-github@1

verified_versions:
  - package: github.com/google/go-github/v*
    versions: ">=93.0.0 <94.0.0"
    checked_with: v93.0.0
    checked: 2026-11-23

