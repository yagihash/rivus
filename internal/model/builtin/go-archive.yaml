# archive/tar and archive/zip: the names inside an archive are sources.
#
# The creator of the archive writes the name of each entry (and the target of a link in a tar), and the name is the entry point of
# zip slip: `../../x` or an absolute path written into the archive reaches the path that the extractor creates. Archive origin
# cannot be known from analysis, so the names are treated as untrusted (label `user_input`, the label that the current sinks
# accept); users who only handle trusted archives judge by the finding's source.
#
# The rows are `kind: field` rows, which fire on the reads of the field in the code of the project (`h.Name` after
# `(*tar.Reader).Next()`, `f.Name` on an element of `(*zip.Reader).File`; `File` embeds `FileHeader`, so one row covers both
# spellings). Not sources, on purpose: the sizes, the modes, the times, the comment of a zip (`FileHeader.Comment`), the owner
# names of a tar (`Uname`, `Gname`): they are not a path that a program creates. `Header.PAXRecords` and `Header.Xattrs`
# are maps of free keys and are not modelled.
ruleset: rivus/go/archive@1

sources:
  - kind: field
    field: archive/tar.Header.Name
    labels: [user_input]
  - kind: field
    field: archive/tar.Header.Linkname
    labels: [user_input]
  - kind: field
    field: archive/zip.FileHeader.Name
    labels: [user_input]
