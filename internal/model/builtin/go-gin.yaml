# gin (github.com/gin-gonic/gin): where untrusted requests come from, and the
# dangerous operations. A handler gets a *gin.Context: it is the request (as
# *http.Request is for net/http), and what its getters return, and what the
# Bind functions fill in, comes from it.
ruleset: rivus/go/gin@1

sources:
  - kind: param_type
    type: "*github.com/gin-gonic/gin.Context"
    labels: [user_input]

propagators:
  - symbol: (*github.com/gin-gonic/gin.Context).Query
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).DefaultQuery
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).GetQuery
    flows: [{from: recv, to: result0}]
  - symbol: (*github.com/gin-gonic/gin.Context).QueryArray
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).GetQueryArray
    flows: [{from: recv, to: result0}]
  - symbol: (*github.com/gin-gonic/gin.Context).QueryMap
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).Param
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).PostForm
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).DefaultPostForm
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).GetPostForm
    flows: [{from: recv, to: result0}]
  - symbol: (*github.com/gin-gonic/gin.Context).PostFormArray
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).PostFormMap
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).FormFile
    flows: [{from: recv, to: result0}]
  - symbol: (*github.com/gin-gonic/gin.Context).MultipartForm
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).GetHeader
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).Cookie
    flows: [{from: recv, to: result0}]
  - symbol: (*github.com/gin-gonic/gin.Context).GetRawData
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).ClientIP
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).FullPath
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).Bind
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).BindJSON
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).BindXML
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).BindQuery
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).BindYAML
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).BindHeader
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).BindUri
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).ShouldBind
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).ShouldBindJSON
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).ShouldBindXML
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).ShouldBindQuery
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).ShouldBindYAML
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).ShouldBindHeader
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).ShouldBindUri
    flows: [{from: recv, to: arg0}]
  - symbol: (*github.com/gin-gonic/gin.Context).ShouldBindBodyWith
    flows: [{from: recv, to: arg0}]

sinks:
  - symbol: (*github.com/gin-gonic/gin.Context).Redirect
    args: [1]
    category: open_redirect
  - symbol: (*github.com/gin-gonic/gin.Context).File
    args: [0]
    category: path_traversal
  - symbol: (*github.com/gin-gonic/gin.Context).FileAttachment
    args: [0]
    category: path_traversal
  - symbol: (*github.com/gin-gonic/gin.Context).SaveUploadedFile
    args: [1]
    category: path_traversal
  # XSS: what is written to the response as it is.
  - symbol: (*github.com/gin-gonic/gin.Context).String
    args: [1, 2]
    accepts: [user_input]
    category: xss
  - symbol: (*github.com/gin-gonic/gin.Context).Data
    args: [2]
    accepts: [user_input]
    category: xss
