# gin (github.com/gin-gonic/gin): where untrusted requests come from, and the dangerous operations. A handler gets a
# *gin.Context: it is the request (as *http.Request is for net/http), and what its getters return, and what the Bind
# functions fill in, comes from it.
#
# Checked against gin v1.12.0 (range >=1.12.0 <2.0.0), 2026-11-23, by reading the published source. Promoted from
# examples/rules/go-gin.yaml (ADR-101); the rows of the example are all here, and the getters, binders and sinks of v1.12.0
# that the example did not have are added. Hand written rows (origin: human); the generator does not exist yet.
#
# Not modelled, on purpose: the key-value store of the context (`Set`, `Get`, `GetString`, ...: what a middleware stored, not
# the request; the body is read), the writers of a response that encode (`JSON`, `XML`, `HTML`, ... : not an XSS of the data), and
# `Context.Next`, `Abort*`, `Copy`, `Handler*` (the handler chain is the project's own code). A `calls:` row for
# `Context.Stream(step)` would say nothing that reaches a sink (the step gets the response writer), so there is none.
ruleset: rivus/go/gin@1

verified_versions:
  - package: github.com/gin-gonic/gin
    versions: ">=1.12.0 <2.0.0"
    checked_with: v1.12.0
    checked: 2026-11-23

sources:
  - kind: param_type
    type: "*github.com/gin-gonic/gin.Context"
    labels: [user_input]

propagators:
  - symbol: (*github.com/gin-gonic/gin.Context).Query
    flows: [{from: recv, to: result}]
  - symbol: (*github.com/gin-gonic/gin.Context).DefaultQuery
