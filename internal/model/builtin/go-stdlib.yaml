# Models for the Go standard library: how taint moves through functions that
# rivus does not analyse (dependencies are boundaries; see ADR-015).
ruleset: rivus/go/stdlib@1

sanitizers:
  - symbol: html.EscapeString
    drops: [user_input]
    adds: [html_escaped]
  - symbol: html/template.HTMLEscapeString
    drops: [user_input]
    adds: [html_escaped]
  - symbol: html/template.JSEscapeString
    drops: [user_input]
    adds: [js_escaped]

propagators:
  # strings
  - symbol: strings.Join
    flows: [{from: args, to: result}]
  # `old` (arg1) is only searched for, it is not in the result (model-diff: EXTRA); `new` and `s` are.
  - symbol: strings.Replace
    flows: [{from: arg0, to: result}, {from: arg2, to: result}]
  - symbol: strings.ReplaceAll
    flows: [{from: arg0, to: result}, {from: arg2, to: result}]
  - symbol: strings.ToUpper
    flows: [{from: args, to: result}]
  - symbol: strings.ToLower
    flows: [{from: args, to: result}]
  - symbol: strings.TrimSpace
    flows: [{from: args, to: result}]
  - symbol: strings.Trim
    flows: [{from: arg0, to: result}]
  - symbol: strings.TrimLeft
    flows: [{from: arg0, to: result}]
  - symbol: strings.TrimRight
    flows: [{from: arg0, to: result}]
  - symbol: strings.TrimPrefix
    flows: [{from: arg0, to: result}]
  - symbol: strings.TrimSuffix
    flows: [{from: arg0, to: result}]
  - symbol: strings.Repeat
    flows: [{from: arg0, to: result}]
  - symbol: strings.Split
    flows: [{from: arg0, to: result}]
  - symbol: strings.SplitN
    flows: [{from: arg0, to: result}]
  - symbol: strings.Fields
    flows: [{from: arg0, to: result}]
  - symbol: strings.Cut
    flows: [{from: arg0, to: result0}, {from: arg0, to: result1}]
  - symbol: strings.NewReader
    flows: [{from: arg0, to: result}]
  - symbol: (*strings.Builder).WriteString
    flows: [{from: arg0, to: recv.content}]
  - symbol: (*strings.Builder).WriteByte
    flows: [{from: arg0, to: recv.content}]
  - symbol: (*strings.Builder).WriteRune
    flows: [{from: arg0, to: recv.content}]
  - symbol: (*strings.Builder).Write
    flows: [{from: arg0, to: recv.content}]
  - symbol: (*strings.Builder).String
    flows: [{from: recv, to: result}]

  # bytes
  - symbol: bytes.NewBufferString
    flows: [{from: arg0, to: result}]
  - symbol: bytes.NewBuffer
    flows: [{from: arg0, to: result}]
  - symbol: bytes.NewReader
    flows: [{from: arg0, to: result}]
  - symbol: (*bytes.Buffer).WriteString
    flows: [{from: arg0, to: recv.content}]
  - symbol: (*bytes.Buffer).Write
    flows: [{from: arg0, to: recv.content}]
  - symbol: (*bytes.Buffer).WriteByte
    flows: [{from: arg0, to: recv.content}]
  - symbol: (*bytes.Buffer).String
    flows: [{from: recv, to: result}]
  - symbol: (*bytes.Buffer).Bytes
    flows: [{from: recv, to: result}]
  - symbol: bytes.ToUpper
    flows: [{from: arg0, to: result}]
  - symbol: bytes.ToLower
    flows: [{from: arg0, to: result}]
  - symbol: bytes.TrimSpace
    flows: [{from: arg0, to: result}]

  # fmt and errors
  # model-diff: extra fmt.Sprintf the arguments are `any`; the reading of the body goes through the type switch of the printer and loses them. The result is made of them
  - symbol: fmt.Sprintf
    flows: [{from: args, to: result}]
  # model-diff: extra fmt.Sprint the arguments are `any`; the reading of the body goes through the type switch of the printer and loses them. The result is made of them
  - symbol: fmt.Sprint
    flows: [{from: args, to: result}]
  # model-diff: extra fmt.Sprintln the arguments are `any`; the reading of the body goes through the type switch of the printer and loses them. The result is made of them
  - symbol: fmt.Sprintln
    flows: [{from: args, to: result}]
  - symbol: fmt.Errorf
    flows: [{from: args, to: result}]
  - symbol: errors.New
    flows: [{from: args, to: result}]
  # model-diff: extra fmt.Fprintf same as Sprintf: the arguments are `any` and the printer is read through a type switch; what is written is made of them
  - symbol: fmt.Fprintf
    flows: [{from: args, to: arg0.content}]
  # model-diff: extra fmt.Fprint same as Sprintf: the arguments are `any` and the printer is read through a type switch; what is written is made of them
  - symbol: fmt.Fprint
    flows: [{from: args, to: arg0.content}]
  # model-diff: extra fmt.Fprintln same as Sprintf: the arguments are `any` and the printer is read through a type switch; what is written is made of them
  - symbol: fmt.Fprintln
    flows: [{from: args, to: arg0.content}]
  # model-diff: miss-reviewed io.WriteString@arg1 the error is the writer's (an unresolved `StringWriter` call that the reading takes as "arguments to results"); the text is not in it
  - symbol: io.WriteString
    flows: [{from: arg1, to: arg0.content}]
  - symbol: (error).Error
    flows: [{from: recv, to: result}]

  # strconv, path, filepath
  # model-diff: extra strconv.Quote the reading of the body goes through runes (numbers), which the analysis stops; the result is `s` quoted
  - symbol: strconv.Quote
    flows: [{from: arg0, to: result}]
  - symbol: path.Join
    flows: [{from: args, to: result}]
  - symbol: path.Clean
    flows: [{from: arg0, to: result}]
  - symbol: path.Base
    flows: [{from: arg0, to: result}]
  - symbol: path.Dir
    flows: [{from: arg0, to: result}]
  - symbol: path/filepath.Join
    flows: [{from: args, to: result}]
  - symbol: path/filepath.Clean
    flows: [{from: arg0, to: result}]
  - symbol: path/filepath.Base
    flows: [{from: arg0, to: result}]
  - symbol: path/filepath.Dir
    flows: [{from: arg0, to: result}]
  - symbol: path/filepath.Abs
    flows: [{from: arg0, to: result0}]

  # flag: what the command line says ends up in the variables of the flag set
  # the error quotes the argument that was not accepted
  - symbol: (*flag.FlagSet).Parse
    flows: [{from: arg0, to: recv}, {from: arg0, to: result0}]
  # model-diff: extra (*flag.FlagSet).Args the probe puts the source in the name of the set (NewFlagSet); the model is about what Parse was given, and Args returns it
  - symbol: (*flag.FlagSet).Args
    flows: [{from: recv, to: result}]
  # model-diff: extra (*flag.FlagSet).Arg the probe puts the source in the name of the set; the model is about what Parse was given
  - symbol: (*flag.FlagSet).Arg
    flows: [{from: recv, to: result}]
  # model-diff: extra (*flag.FlagSet).String the row writes the name and the usage into the set and then reads the set (what Parse was given) into the result, so they reach it too; accepted, they are constants in practice
  - symbol: (*flag.FlagSet).String
    flows: [{from: recv, to: result}, {from: arg0, to: recv}, {from: arg1, to: result}, {from: arg1, to: recv}, {from: arg2, to: recv}]
  # model-diff: extra (*flag.FlagSet).Int the row writes the name and the usage into the set and then reads the set (what Parse was given) into the result, so they reach it too; accepted, they are constants in practice
  - symbol: (*flag.FlagSet).Int
    flows: [{from: recv, to: result}, {from: arg0, to: recv}, {from: arg1, to: result}, {from: arg1, to: recv}, {from: arg2, to: recv}]
  # model-diff: extra (*flag.FlagSet).Bool the row writes the name and the usage into the set and then reads the set (what Parse was given) into the result, so they reach it too; accepted, they are constants in practice
  - symbol: (*flag.FlagSet).Bool
    flows: [{from: recv, to: result}, {from: arg0, to: recv}, {from: arg1, to: result}, {from: arg1, to: recv}, {from: arg2, to: recv}]
  # model-diff: extra (*flag.FlagSet).Duration the row writes the name and the usage into the set and then reads the set (what Parse was given) into the result, so they reach it too; accepted, they are constants in practice
  - symbol: (*flag.FlagSet).Duration
    flows: [{from: recv, to: result}, {from: arg0, to: recv}, {from: arg1, to: result}, {from: arg1, to: recv}, {from: arg2, to: recv}]
  # model-diff: extra (*flag.FlagSet).StringVar the row writes the name and the usage into the set and then reads the set (what Parse was given) into the result, so they reach it too; accepted, they are constants in practice
  - symbol: (*flag.FlagSet).StringVar
    flows: [{from: recv, to: arg0}, {from: arg1, to: recv}, {from: arg2, to: arg0}, {from: arg2, to: recv}, {from: arg3, to: recv}]
  # model-diff: extra (*flag.FlagSet).IntVar the row writes the name and the usage into the set and then reads the set (what Parse was given) into the result, so they reach it too; accepted, they are constants in practice
  - symbol: (*flag.FlagSet).IntVar
    flows: [{from: recv, to: arg0}, {from: arg1, to: recv}, {from: arg2, to: arg0}, {from: arg2, to: recv}, {from: arg3, to: recv}]
  # model-diff: extra (*flag.FlagSet).BoolVar the row writes the name and the usage into the set and then reads the set (what Parse was given) into the result, so they reach it too; accepted, they are constants in practice
  - symbol: (*flag.FlagSet).BoolVar
    flows: [{from: recv, to: arg0}, {from: arg1, to: recv}, {from: arg2, to: arg0}, {from: arg2, to: recv}, {from: arg3, to: recv}]
  # model-diff: extra (*flag.FlagSet).DurationVar the row writes the name and the usage into the set and then reads the set (what Parse was given) into the result, so they reach it too; accepted, they are constants in practice
  - symbol: (*flag.FlagSet).DurationVar
    flows: [{from: recv, to: arg0}, {from: arg1, to: recv}, {from: arg2, to: arg0}, {from: arg2, to: recv}, {from: arg3, to: recv}]
  - symbol: (*flag.FlagSet).Var
    flows: [{from: recv, to: arg0}, {from: arg1, to: recv}, {from: arg2, to: recv}]

  # io and bufio
  - symbol: io.ReadAll
    flows: [{from: arg0, to: result0}]
  - symbol: io.LimitReader
    flows: [{from: arg0, to: result}]
  # model-diff: miss-reviewed io.Copy@arg1 the error is the reader's or the writer's (an unresolved `ReaderFrom` / `WriterTo` call that the reading takes as "arguments to results"); the data is not in it
  - symbol: io.Copy
    flows: [{from: arg1, to: arg0.content}]
  - symbol: (io.Reader).Read
    flows: [{from: recv, to: arg0}]
  - symbol: (io.Writer).Write
    flows: [{from: arg0, to: recv.content}]
  - symbol: (io/fs.DirEntry).Name
    flows: [{from: recv, to: result}]
  - symbol: (io/fs.FileInfo).Name
    flows: [{from: recv, to: result}]
  - symbol: (io/fs.DirEntry).Info
    flows: [{from: recv, to: result0}]
  - symbol: (hash.Hash).Sum
    flows: [{from: recv, to: result}, {from: arg0, to: result}]
  - symbol: bufio.NewReader
    flows: [{from: arg0, to: result}]
  - symbol: bufio.NewScanner
    flows: [{from: arg0, to: result}]
  - symbol: (*bufio.Reader).ReadString
    flows: [{from: recv, to: result0}]
  - symbol: (*bufio.Reader).ReadBytes
    flows: [{from: recv, to: result0}]
  # model-diff: extra (*bufio.Scanner).Text the probe calls Text without Scan; the token is filled by Scan from the reader
  - symbol: (*bufio.Scanner).Text
    flows: [{from: recv, to: result}]
  # model-diff: extra (*bufio.Scanner).Bytes same as Text
  - symbol: (*bufio.Scanner).Bytes
    flows: [{from: recv, to: result}]

  # encoding/json
  # the error of a syntax error quotes the byte of the input (`invalid character 'x' ...`): input -> error
  # model-diff: miss-reviewed encoding/json.Unmarshal@arg1 the reading of the body puts only the type of `v` (reflect.TypeOf) in the error, not what it holds; no flow of data
  - symbol: encoding/json.Unmarshal
    flows: [{from: arg0, to: arg1}, {from: arg0, to: result0}]
  - symbol: encoding/json.NewDecoder
    flows: [{from: arg0, to: result}]
  # model-diff: miss-reviewed (*encoding/json.Decoder).Decode@arg0 the same: only the type of `v` goes into the error
  - symbol: (*encoding/json.Decoder).Decode
    flows: [{from: recv, to: arg0}, {from: recv, to: result0}]
  - symbol: encoding/json.Marshal
    flows: [{from: arg0, to: result0}]
  # model-diff: extra encoding/json.MarshalIndent the reading of the body copies the bytes of the encoding one by one (numbers), which the analysis stops; the result is the value indented
  - symbol: encoding/json.MarshalIndent
    flows: [{from: arg0, to: result0}, {from: arg1, to: result0}, {from: arg2, to: result0}]

  # encoding/base64, encoding/hex
  # model-diff: extra (*encoding/base64.Encoding).DecodeString the reading of the body works on bytes one by one (numbers), which the analysis stops; the result is the input recoded
  - symbol: (*encoding/base64.Encoding).DecodeString
    flows: [{from: arg0, to: result0}]
  # model-diff: extra (*encoding/base64.Encoding).EncodeToString the reading of the body works on bytes one by one (numbers), which the analysis stops; the result is the input recoded
  - symbol: (*encoding/base64.Encoding).EncodeToString
    flows: [{from: arg0, to: result}]
  # model-diff: extra encoding/hex.DecodeString the reading of the body works on bytes one by one (numbers), which the analysis stops; the result is the input recoded
  - symbol: encoding/hex.DecodeString
    flows: [{from: arg0, to: result0}]
  # model-diff: extra encoding/hex.EncodeToString the reading of the body works on bytes one by one (numbers), which the analysis stops; the result is the input recoded
  - symbol: encoding/hex.EncodeToString
    flows: [{from: arg0, to: result}]

  # net/url
  - symbol: net/url.Parse
    flows: [{from: arg0, to: results}]
  - symbol: net/url.ParseRequestURI
    flows: [{from: arg0, to: results}]
  - symbol: net/url.ParseQuery
    flows: [{from: arg0, to: results}]
  - symbol: net/url.QueryEscape
    flows: [{from: arg0, to: result}]
  - symbol: net/url.PathEscape
    flows: [{from: arg0, to: result}]
  - symbol: net/url.QueryUnescape
    flows: [{from: arg0, to: results}]
  - symbol: (*net/url.URL).String
    flows: [{from: recv, to: result}]
  - symbol: (*net/url.URL).Query
    flows: [{from: recv, to: result}]
  - symbol: (*net/url.URL).JoinPath
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: (net/url.Values).Get
    flows: [{from: recv, to: result}]
  - symbol: (net/url.Values).Encode
    flows: [{from: recv, to: result}]
  - symbol: (net/url.Values).Set
    flows: [{from: arg0, to: recv}, {from: arg1, to: recv}]
  - symbol: (net/url.Values).Add
    flows: [{from: arg0, to: recv}, {from: arg1, to: recv}]
  - symbol: mime.ParseMediaType
    flows: [{from: arg0, to: result0}, {from: arg0, to: result1}]

sinks:
  # command injection
  - symbol: os/exec.Command
    category: command_injection
  - symbol: os/exec.CommandContext
    args: [1, 2]
    category: command_injection

  # SQL injection: only the query string is dangerous, not the bound args.
  - symbol: (*database/sql.DB).Query
    args: [0]
    category: sql_injection
  - symbol: (*database/sql.DB).QueryRow
    args: [0]
    category: sql_injection
  - symbol: (*database/sql.DB).Exec
    args: [0]
    category: sql_injection
  - symbol: (*database/sql.DB).Prepare
    args: [0]
    category: sql_injection
  - symbol: (*database/sql.DB).QueryContext
    args: [1]
    category: sql_injection
  - symbol: (*database/sql.DB).QueryRowContext
    args: [1]
    category: sql_injection
  - symbol: (*database/sql.DB).ExecContext
    args: [1]
    category: sql_injection
  - symbol: (*database/sql.DB).PrepareContext
    args: [1]
    category: sql_injection
  - symbol: (*database/sql.Tx).Query
    args: [0]
    category: sql_injection
  - symbol: (*database/sql.Tx).QueryRow
    args: [0]
    category: sql_injection
  - symbol: (*database/sql.Tx).Exec
    args: [0]
    category: sql_injection
  - symbol: (*database/sql.Tx).QueryContext
    args: [1]
    category: sql_injection
  - symbol: (*database/sql.Tx).QueryRowContext
    args: [1]
    category: sql_injection
  - symbol: (*database/sql.Tx).ExecContext
    args: [1]
    category: sql_injection

  # path traversal
  - symbol: os.Open
    args: [0]
    category: path_traversal
  - symbol: os.OpenFile
    args: [0]
    category: path_traversal
  - symbol: os.ReadFile
    args: [0]
    category: path_traversal
  - symbol: os.WriteFile
    args: [0]
    category: path_traversal
  - symbol: os.Create
    args: [0]
    category: path_traversal
  - symbol: os.Remove
    args: [0]
    category: path_traversal
  - symbol: os.RemoveAll
    args: [0]
    category: path_traversal
  - symbol: os.Mkdir
    args: [0]
    category: path_traversal
  - symbol: os.MkdirAll
    args: [0]
    category: path_traversal
  - symbol: os.Rename
    args: [0, 1]
    category: path_traversal
  - symbol: os.ReadDir
    args: [0]
    category: path_traversal
  - symbol: os.Chmod
    args: [0]
    category: path_traversal
  - symbol: os.Truncate
    args: [0]
    category: path_traversal
  - symbol: os.Symlink
    args: [0, 1]
    category: path_traversal
  - symbol: os.Link
    args: [0, 1]
    category: path_traversal
  # io/ioutil: the same operations (deprecated, and still everywhere)
  - symbol: io/ioutil.ReadFile
    args: [0]
    category: path_traversal
  - symbol: io/ioutil.WriteFile
    args: [0]
    category: path_traversal
  - symbol: io/ioutil.ReadDir
    args: [0]
    category: path_traversal
