# sqlx (github.com/jmoiron/sqlx): the query-string sinks of the wrapper over database/sql. The rows of database/sql itself
# (`(*database/sql.DB).Query` and the others) are in go-stdlib.yaml and are not repeated: `sqlx.DB`, `sqlx.Tx` and `sqlx.Conn`
# embed the database/sql types, so Query/Exec/Prepare and their Context forms are the rows there. This file has the methods and
# functions that sqlx adds, each with the query string as the only dangerous argument (the bound args are not).
#
# Checked against sqlx v1.4.0 (range >=1.4.0 <2.0.0), 2026-11-23, by reading the published source. Hand written rows
# (origin: human); the generator does not exist yet.
#
# Not modelled, on purpose: `NamedStmt` and `Stmt` methods (the query was fixed when the statement was prepared: the sink is
# `Preparex` / `PrepareNamed`), `Named`, `BindNamed`, `Rebind`, `In` (they build a string but run nothing; the string reaches
# a sink below if it is used), `LoadFile` (the argument is a path to a file, not a query), the interfaces `Queryer`, `Execer`,
# `Ext` and the Context forms (the call through an interface has no symbol of its own to put a row on; the call is a call of
# the concrete method when the type is known), and the sources: sqlx has no source (the values of a row come from the stored
# data, which is a boundary the user sets, as for database/sql).
ruleset: rivus/go/sqlx@1

verified_versions:
  - package: github.com/jmoiron/sqlx
    versions: ">=1.4.0 <2.0.0"
    checked_with: v1.4.0
    checked: 2026-11-23

