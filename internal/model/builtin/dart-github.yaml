# package:github: the GitHub API client of Dart (`GitHub`, `RepositoriesService`, the models of repositories, files, issues and pull requests).
#
# Checked by reading the published source of 9.26.0. Hand written rows (origin: human); the generator does not exist yet.
#
# The boundary (docs/MODEL-QUEUE.md, row 7):
# * `resource_name`: what decides the resource that a call reaches. The owner and the name of a `RepositorySlug` (the slug is
#   put into the path of the request, `/repos/<owner>/<name>/...`), and the path, the ref, the branch and the sha that a call of
#   `RepositoriesService` takes. A value of the user there can point to another repository, another file or another ref than
#   the program meant. (As the names of the Google Cloud resources: dart-gcp.yaml.) The rows are on the service methods that
#   take a path or a ref and not on every method that takes a slug: the slug is a sink where it is made.
# * `GitHub.request`, `requestJson`, `getJSON`, `postJSON`: the `path` is put after the endpoint. The same category.
# * Sources, the criterion: a client of a service makes a value a source when it carries what a user of the service wrote
#   (the text of a file, an issue, a comment). A value that the service decides (an id, a time, a sha, a count, a URL that the
#   service builds) is not a source. A value that is hard to say is not made a source, and the reason is written here.
#   This is why the body of a response is a source here and not in `dart-http.yaml`: there the server is the one that the
#   program chose to call, and here the text is that of the users of a repository, which the program does not control.
#   `GitHubFile.text`, the decoded content of a file of a repository, is the source. The rule format has no label that tells
#   "from an external service" from the default `user_input`, so it has the default (docs/ISSUES.md, #159).
#   Candidates that are not sources, and why: `GitHubFile.content` (the same text, undecoded), the `body` and the title of
#   `Issue`, `IssueComment` and `PullRequest`, the message of a commit: they are plain fields, and a `kind: field` source fires
#   also on the constructor of the class and on every read of the field inside the package, which the zoo reports as unexpected
#   flows (the skeleton of the zoo is read as part of the project). Known miss, with the cells: docs/issues/model-github-field-source-in-dependency.md.
# * The service methods have no `flows` row: their bodies are read (they are a few lines each and reach `GitHub.request`, which
#   reaches `package:http`, whose own rows stand for the clients).
# The notes `# model-diff:` are for `bench/model-diff` (docs/MODEL-RUNBOOK.md, 9): how to make a value of a class for the generated calls.
# model-diff: value RepositorySlug RepositorySlug('o', 'r')
# model-diff: value RepositoriesService RepositoriesService(GitHub())
# model-diff: value GitHub GitHub()
ruleset: rivus/dart/github@1

verified_versions:
  - package: github
    versions: ">=9.0.0 <10.0.0"
    checked_with: 9.26.0
    checked: 2026-11-23

sources:
  - symbol: package:github/src/common/model/repos_contents.dart#GitHubFile.text
    labels: [user_input]

sinks:
  # the slug: where the owner and the name are put together
  - symbol: package:github/src/common/model/repos.dart#RepositorySlug.new
    args: [0, 1]
    category: resource_name
  - symbol: package:github/src/common/model/repos.dart#RepositorySlug.full
    args: [0]
    category: resource_name

  # the service of repositories: the path, the ref, the branch, the sha
  - symbol: package:github/src/common/repos_service.dart#RepositoriesService.getBranch
    args: [1]
    category: resource_name
  - symbol: package:github/src/common/repos_service.dart#RepositoriesService.getCommit
    args: [1]
    category: resource_name
  - symbol: package:github/src/common/repos_service.dart#RepositoriesService.compareCommits
    args: [1, 2]
    category: resource_name
  - symbol: package:github/src/common/repos_service.dart#RepositoriesService.getReadme
    named: [ref]
    category: resource_name
  - symbol: package:github/src/common/repos_service.dart#RepositoriesService.getContents
    args: [1]
    named: [ref]
    category: resource_name
  - symbol: package:github/src/common/repos_service.dart#RepositoriesService.updateFile
    args: [1]
    named: [branch]
    category: resource_name
  - symbol: package:github/src/common/repos_service.dart#RepositoriesService.deleteFile
    args: [1, 4]
    category: resource_name
  - symbol: package:github/src/common/repos_service.dart#RepositoriesService.getArchiveLink
    args: [1]
    category: resource_name
  - symbol: package:github/src/common/model/repos_contents.dart#CreateFile.new
    named: [path, branch]
    category: resource_name

  # the path of a request, after the endpoint
  - symbol: package:github/src/common/github.dart#GitHub.request
    args: [1]
    category: resource_name
  - symbol: package:github/src/common/github.dart#GitHub.requestJson
    args: [1]
    category: resource_name
  - symbol: package:github/src/common/github.dart#GitHub.getJSON
    args: [0]
    category: resource_name
  - symbol: package:github/src/common/github.dart#GitHub.postJSON
    args: [0]
    category: resource_name
