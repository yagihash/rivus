# Standard library calls that the benchmarks (Gogs, gin-vue-admin, ZITADEL) call and that
# nothing modelled: the most frequent first. A call without a model is a guess (everything
# that goes in may come out), and the guess is an uncertainty on every path through it.
ruleset: rivus/go/stdlib-more@1

