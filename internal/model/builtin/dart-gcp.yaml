# Google Cloud clients for Dart: package:gcloud, package:googleapis (storage/v1, pubsub/v1, bigquery/v2, datastore/v1),
# package:google_cloud_storage.
#
# These are built in because the maintainer uses them: it is the maintainer's choice, as for the Go clients
# (go-gcp.yaml, ADR-077). It is not a criterion for any other library. Only sinks are here (the body of a dependency is
# read as before), and no source: what a subscription delivers, and what a bucket or a table returns, is data that the
# user chooses to trust or not (docs/GCP-MODELS.md, section 0), as for Go.
#
# * A name that the user decides (a bucket, an object, a topic, a subscription, the kind of a key) can point to another
#   resource of the project, or of another project. No older category fits, so they are `resource_name`.
# * The text of a BigQuery or a GQL query is `sql_injection`; the push endpoint of a subscription is `ssrf`.
# * Only the positional arguments are named (docs/MODELING.md, section 4): `Query(kind: ...)` and
#   `QueryRequest(query: ...)` are not a position. `parts` names the field of a request that is handed to a resource.
# * One symbol has one category: the subscription calls that carry a push endpoint (`modifyPushConfig`, `create`, `patch`) have the
#   endpoint (`ssrf`) and not the name of the subscription.
# * The rows are on the interface of a package (a call through it reaches the implementation: ADR-068) and not on the
#   implementation too, so that one flow is one finding.
# docs/GCP-MODELS.md (the tables of Dart) says which API has a row, and which has not and why.
ruleset: rivus/dart/gcp@1

sinks:
  # package:gcloud, Cloud Storage (storage.dart): the names of a bucket, and of an object in a bucket. The rows are on the interface
  # (Storage, Bucket); a call through the interface reaches the implementation of the package, whose body is read as before.
