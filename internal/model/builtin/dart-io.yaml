# dart:io (and dart:html): where untrusted data comes from on the server and
# the dangerous operations.
ruleset: rivus/dart/io@1

sources:
  # every handler parameter of this type is attacker controlled
  - kind: param_type
    type: "dart:io#HttpRequest"
    labels: [user_input]
  - symbol: dart:io#Stdin.readLineSync
    labels: [user_input]
  - symbol: dart:io#Stdin.readLine
    labels: [user_input]
  - symbol: dart:io#File.readAsString
    labels: [file_content]
  - symbol: dart:io#File.readAsStringSync
    labels: [file_content]
  - symbol: dart:io#File.readAsLines
    labels: [file_content]
  - symbol: dart:io#File.readAsLinesSync
    labels: [file_content]
  - symbol: dart:io#File.readAsBytes
    labels: [file_content]
  - symbol: dart:io#File.readAsBytesSync
    labels: [file_content]

propagators:
  - symbol: dart:io#HttpRequest.uri
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpRequest.requestedUri
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpRequest.headers
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpRequest.cookies
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpRequest.method
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpRequest.session
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpRequest.connectionInfo
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpRequest.certificate
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpHeaders.value
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpHeaders.operator[]
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpHeaders.forEach
    flows: [{from: recv, to: result}]
  - symbol: dart:io#Cookie.value
    flows: [{from: recv, to: result}]
  - symbol: dart:io#Cookie.name
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpResponse.headers
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpRequest.listen
    flows: [{from: recv, to: result}]
  - symbol: dart:io#HttpRequest.transform
    flows: [{from: recv, to: result}]
  - symbol: dart:io#File.new
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#Directory.new
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#Link.new
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#File.fromUri
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#Directory.fromUri
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#File.absolute
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#File.parent
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#File.path
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#Directory.path
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#FileSystemEntity.path
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#File.uri
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#FileSystemEntity.resolveSymbolicLinksSync
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#Directory.resolveSymbolicLinksSync
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#Link.resolveSymbolicLinksSync
    flows: [{from: recv, to: result}, {from: args, to: result}]
  - symbol: dart:io#HttpResponse.add
    flows: [{from: arg0, to: recv}]
  - symbol: dart:io#HttpResponse.addStream
    flows: [{from: arg0, to: recv}]
  - symbol: dart:io#File.writeAsString
    flows: [{from: arg0, to: recv}]
  - symbol: dart:io#File.writeAsStringSync
    flows: [{from: arg0, to: recv}]
  - symbol: dart:io#File.writeAsBytes
    flows: [{from: arg0, to: recv}]

sinks:
  # command injection
  - symbol: dart:io#Process.run
    args: [0, 1]
    category: command_injection
    accepts: [user_input]
  - symbol: dart:io#Process.runSync
    args: [0, 1]
    category: command_injection
    accepts: [user_input]
  - symbol: dart:io#Process.start
    args: [0, 1]
    category: command_injection
    accepts: [user_input]
  # path traversal: the path a file or a directory is made from
  - symbol: dart:io#File.new
    args: [0]
    category: path_traversal
    accepts: [user_input]
  - symbol: dart:io#Directory.new
    args: [0]
    category: path_traversal
    accepts: [user_input]
  - symbol: dart:io#Link.new
    args: [0]
    category: path_traversal
    accepts: [user_input]
  # the target a link points to (the path of the link itself is Link.new)
  - symbol: dart:io#Link.create
    args: [0]
    category: path_traversal
    accepts: [user_input]
  - symbol: dart:io#Link.createSync
    args: [0]
    category: path_traversal
    accepts: [user_input]
  # SSRF: outgoing requests to attacker controlled URLs
  - symbol: dart:io#HttpClient.getUrl
    args: [0]
    category: ssrf
    accepts: [user_input]
  - symbol: dart:io#HttpClient.postUrl
    args: [0]
    category: ssrf
    accepts: [user_input]
  - symbol: dart:io#HttpClient.openUrl
    args: [1]
    category: ssrf
    accepts: [user_input]
  - symbol: dart:io#HttpClient.get
    args: [0, 1]
    category: ssrf
    accepts: [user_input]
  - symbol: dart:io#HttpClient.post
    args: [0, 1]
    category: ssrf
    accepts: [user_input]
  - symbol: dart:io#HttpClient.open
    args: [1, 2]
    category: ssrf
    accepts: [user_input]
  - symbol: dart:io#Socket.connect
    args: [0]
    category: ssrf
    accepts: [user_input]
  # HTML injection in the browser
  - symbol: dart:html#Element.innerHtml
    args: [0]
    category: xss
    accepts: [user_input]
  - symbol: dart:html#Element.outerHtml
    args: [0]
    category: xss
    accepts: [user_input]
  - symbol: dart:html#Element.setInnerHtml
    args: [0]
    category: xss
    accepts: [user_input]
  - symbol: dart:html#Element.insertAdjacentHtml
    args: [1]
    category: xss
    accepts: [user_input]
