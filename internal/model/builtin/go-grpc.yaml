# gRPC (google.golang.org/grpc) on the server side: where what a client sent comes
# from, and the calls that go out to an address a client names.
#
# What a client sent to a service of the project. The generated code (protoc-gen-go-grpc)
# has to exist when the analysis runs: it is what says which methods are the handlers
# of a service. Every interface that has a method named mustEmbedUnimplemented...
# is a service, and what its methods are given in parameters that are messages is
# input. (The request reaches the handler through a function value and an interface
# that the call graph does not connect, so the handlers are declared here.) A
# service generated with require_unimplemented_servers=false has no such method:
# declare its handlers in the rules of the project.
ruleset: rivus/go/grpc@1

sources:
  - kind: param
    match: implementations
    marker: "mustEmbedUnimplemented*"
    labels: [user_input]
  # The metadata (the headers) of the call: what the client wrote.
  - symbol: google.golang.org/grpc/metadata.FromIncomingContext
    labels: [user_input]
  - symbol: google.golang.org/grpc/metadata.ValueFromIncomingContext
    labels: [user_input]
  # A stream of requests: RecvMsg fills the message it is given with what the
  # client sent. The generated Recv() of a client-streaming or bidirectional
  # service calls it, and so does a handler that takes the stream.
  - symbol: (google.golang.org/grpc.ServerStream).RecvMsg
    out: [0]
    labels: [user_input]
  - symbol: (*google.golang.org/grpc.serverStream).RecvMsg
    out: [0]
    labels: [user_input]

sinks:
  # SSRF: a connection to an address the caller chose.
  - symbol: google.golang.org/grpc.NewClient
    args: [0]
    category: ssrf
  - symbol: google.golang.org/grpc.Dial
    args: [0]
    category: ssrf
  - symbol: google.golang.org/grpc.DialContext
    args: [1]
    category: ssrf
