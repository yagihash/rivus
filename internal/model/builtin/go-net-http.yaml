# net/http: where untrusted requests come from, how data moves through the
# request, and the dangerous operations.
ruleset: rivus/go/net-http@1

sources:
  # Every parameter of type *http.Request is attacker controlled. This covers
  # handlers however they are registered.
  - kind: param_type
    type: "*net/http.Request"
    labels: [user_input]

propagators:
  # model-diff: extra (*net/http.Request).FormValue the model takes the request as one value (what is in it reaches what it returns); the probe puts the source in the argument of NewRequest that makes one field (the method or the URL), which this one does not read
  - symbol: (*net/http.Request).FormValue
    flows: [{from: recv, to: result}]
  # model-diff: extra (*net/http.Request).PostFormValue the model takes the request as one value (what is in it reaches what it returns); the probe puts the source in the argument of NewRequest that makes one field (the method or the URL), which this one does not read
  - symbol: (*net/http.Request).PostFormValue
    flows: [{from: recv, to: result}]
  # model-diff: extra (*net/http.Request).Cookie the model takes the request as one value (what is in it reaches what it returns); the probe puts the source in the argument of NewRequest that makes one field (the method or the URL), which this one does not read
  - symbol: (*net/http.Request).Cookie
    flows: [{from: recv, to: result0}]
  # model-diff: extra (*net/http.Request).Cookies the model takes the request as one value (what is in it reaches what it returns); the probe puts the source in the argument of NewRequest that makes one field (the method or the URL), which this one does not read
  - symbol: (*net/http.Request).Cookies
    flows: [{from: recv, to: result}]
  # model-diff: extra (*net/http.Request).PathValue the model takes the request as one value (what is in it reaches what it returns); the probe puts the source in the argument of NewRequest that makes one field (the method or the URL), which this one does not read
  - symbol: (*net/http.Request).PathValue
    flows: [{from: recv, to: result}]
  # model-diff: extra (*net/http.Request).BasicAuth the model takes the request as one value (what is in it reaches what it returns); the probe puts the source in the argument of NewRequest that makes one field (the method or the URL), which this one does not read
  - symbol: (*net/http.Request).BasicAuth
    flows: [{from: recv, to: result0}, {from: recv, to: result1}]
  - symbol: (*net/http.Request).ParseForm
    flows: [{from: recv, to: recv}]
  # model-diff: miss-reviewed (net/http.Header).Get@arg0 body-default #155 the key of a lookup in a map is taken as flowing to the value it finds; the value is not made of the key
  - symbol: (net/http.Header).Get
    flows: [{from: recv, to: result}]
  # model-diff: miss-reviewed (net/http.Header).Values@arg0 body-default #155 the same as Get
  - symbol: (net/http.Header).Values
    flows: [{from: recv, to: result}]
  # model-diff: extra (net/http.Header).Set #154 the header is a map that `textproto.MIMEHeader(h)` converts; the reading of the body does not follow the write through the converted map. The value is stored in the header
  - symbol: (net/http.Header).Set
    flows: [{from: arg1, to: recv}]
  # model-diff: extra (net/http.Header).Add #154 the same as Set
  - symbol: (net/http.Header).Add
    flows: [{from: arg1, to: recv}]
  # model-diff: extra (*net/http.Request).Context the model takes the request as one value (what is in it reaches what it returns); the probe puts the source in the argument of NewRequest that makes one field (the method or the URL), which this one does not read
  - symbol: (*net/http.Request).Context
    flows: [{from: recv, to: result}]
  - symbol: (net/http.ResponseWriter).Header
    flows: [{from: recv, to: result}]
  - symbol: (*net/http.Client).Do
    flows: [{from: arg0, to: result0}]
  - symbol: net/http.MaxBytesReader
    flows: [{from: arg1, to: result}]
  - symbol: net/http.NewRequest
    flows: [{from: args, to: result0}, {from: arg0, to: result1}, {from: arg1, to: result1}]
  - symbol: net/http.NewRequestWithContext
    flows: [{from: args, to: result0}, {from: arg1, to: result1}, {from: arg2, to: result1}]

sinks:
  # SSRF: outgoing requests to attacker controlled URLs.
  - symbol: net/http.Get
    args: [0]
    category: ssrf
  - symbol: net/http.Head
    args: [0]
    category: ssrf
  - symbol: net/http.Post
    args: [0]
    category: ssrf
  - symbol: net/http.PostForm
    args: [0]
    category: ssrf
  - symbol: (*net/http.Client).Get
    args: [0]
    category: ssrf
  - symbol: (*net/http.Client).Head
    args: [0]
    category: ssrf
  - symbol: (*net/http.Client).Post
    args: [0]
    category: ssrf
  - symbol: net/http.NewRequest
    args: [1]
    category: ssrf
  - symbol: net/http.NewRequestWithContext
    args: [2]
    category: ssrf

  # Open redirect.
  - symbol: net/http.Redirect
    args: [2]
    category: open_redirect

  # XSS: only data that has not been HTML-escaped.
  - symbol: (net/http.ResponseWriter).Write
    args: [0]
    accepts: [user_input]
    category: xss
  # The same, written with fmt or io: only when the writer is a response (not
  # os.Stderr or a buffer).
  - symbol: fmt.Fprint
    args: [1]
    accepts: [user_input]
    category: xss
    when_arg_type: {arg: 0, types: [net/http.ResponseWriter]}
  - symbol: fmt.Fprintln
    args: [1]
    accepts: [user_input]
    category: xss
    when_arg_type: {arg: 0, types: [net/http.ResponseWriter]}
  - symbol: fmt.Fprintf
    args: [1, 2]
    accepts: [user_input]
    category: xss
    when_arg_type: {arg: 0, types: [net/http.ResponseWriter]}
  - symbol: io.WriteString
    args: [1]
    accepts: [user_input]
    category: xss
    when_arg_type: {arg: 0, types: [net/http.ResponseWriter]}
