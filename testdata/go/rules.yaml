# Rules for the test cases. The symbols refer to testdata/go/lib.
ruleset: rivus/testdata@1

sources:
  - symbol: example.com/cases/lib.Source
    labels: [user_input]
  - symbol: example.com/cases/lib.SourceBytes
    labels: [user_input]

  # Entry points declared by function (testdata/go/cases/entry).
  - kind: param
    symbol: example.com/cases/cases/entry.Handle
    params: [1]
    labels: [user_input]
  - kind: param
    symbol: (*example.com/cases/cases/entry.Server).Serve
    recv: true
    params: [0]
    labels: [user_input]

  # Parameters that taint the object they point to (testdata/go/cases/paramshare).
  - kind: param
    symbol: example.com/cases/cases/paramshare/ptr.runB
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/local.runB
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/global.runB
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/repro.runA
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/repro.runB
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/distinct.runA
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/distinct.runB
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/samelocal.runA
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/samelocal.runB
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/str.runA
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/str.runB
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/router.handlerA
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/router.handlerB
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/direct.runB
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/lost.runB
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/gwrite.handler
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/gwritehelper.handler
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/gqueue.handler
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/ctxstate.handler
    params: [0]
    labels: [user_input]
  - kind: param
    symbol: example.com/cases/cases/paramshare/ctxptr.handler
    params: [0]
    labels: [user_input]
  - kind: param_type
    type: "*example.com/cases/cases/paramshare/ptype.Req"
    labels: [user_input]

  # One type under two names (testdata/go/cases/typealias): the rule for A names
  # the alias, the rule for B names the type.
  - kind: param_type
    type: "*example.com/cases/cases/typealias/api.AliasA"
    labels: [user_input]
  - kind: param_type
    type: "*example.com/cases/cases/typealias/real.B"
    labels: [user_input]

  # A call that fills its argument (testdata/go/cases/dbsrc).
  - symbol: example.com/cases/lib.Fill
    out: [0]
    labels: [stored]
  - symbol: example.com/cases/lib.FillAny
    out: [0]
    labels: [stored]
  # database/sql: Scan fills its (variadic) destinations (testdata/go/cases/dbsrc).
  - symbol: (*database/sql.Rows).Scan
    out: [0]
    labels: [stored]
  # Any field of a type (testdata/go/cases/dbsrc).
  - kind: field
    field: example.com/cases/cases/dbsrc.Row.*
    labels: [stored]

  # The same type under two names (testdata/go/cases/typealias).
  - kind: field
    field: example.com/cases/cases/typealias/api.AliasC.F
    labels: [user_input]
  - kind: field
    field: example.com/cases/cases/typealias/real.D.F
    labels: [user_input]

  # A field of a struct (testdata/go/cases/irshape).
  - kind: field
    field: example.com/cases/cases/irshape.T.a
    labels: [user_input]

sinks:
  - symbol: example.com/cases/lib.Sink
    category: test
  - symbol: example.com/cases/lib.SinkBytes
    category: test
  - symbol: example.com/cases/lib.SinkAny
    category: test
  - symbol: (example.com/cases/lib.Runner).Run
    category: test
  # Sinks that return something and have no model of the flow (testdata/go/cases/sinkret).
  - symbol: example.com/cases/lib.Open
    args: [0]
    category: test
  - symbol: (*example.com/cases/lib.DB).Prepare
    args: [0]
    category: test

  # when_arg_type on a method: recv: true is the receiver, arg counts without it (testdata/go/cases/recvcond).
  - symbol: (example.com/cases/cases/recvcond.Out).Put
    args: [0]
    category: test
    when_arg_type: {recv: true, types: [example.com/cases/cases/recvcond.Web]}
  - symbol: (example.com/cases/cases/recvcond.Box).Fill
    args: [1]
    category: test
    when_arg_type: {arg: 0, types: [example.com/cases/cases/recvcond.Web]}

  # sinks that name a part of the value (testdata/go/cases/fieldsink)
  - symbol: example.com/cases/lib.SinkReq
    args: [0]
    field: Q
    category: test
  - symbol: example.com/cases/lib.SinkWrap
    args: [0]
    field: Req.Q
    category: test
  - symbol: example.com/cases/lib.SinkReqTypo
    args: [0]
    field: Qq
    category: test
  - symbol: (*example.com/cases/lib.Store).Run
    parts:
      - {arg: 0, field: Q}
    category: test

  # match: implementations: the implementations of the interface method are
  # sinks as well (testdata/go/cases/impl).
  - symbol: (example.com/cases/cases/impl.Store).Save
    match: implementations
    category: test

  # a rule on a type of the standard library, reached through an interface of the project
  # (testdata/go/cases/ownif).
  - symbol: (*database/sql.DB).QueryContext
    args: [1]
    category: test

sanitizers:
  - symbol: example.com/cases/lib.Sanitize
    drops: [user_input]


propagators:
  # a flow that the model says is an approximation (testdata/go/cases/approx)
  - symbol: example.com/cases/lib.External
    flows: [{from: arg0, to: result, approximate: "the output of an external program: whether it carries the arguments depends on the program"}]
  - symbol: example.com/cases/lib.Exact
    flows: [{from: arg0, to: result}]
  # the whole request holds the text (testdata/go/cases/fieldsink)
  - symbol: example.com/cases/lib.NewReq
    flows: [{from: arg0, to: result}]
  # functions that call a function they are given (testdata/go/cases/callbacks)
  - symbol: example.com/cases/lib.Apply
    calls: [{fn: arg1, with: [arg0], ret: result0}]
  - symbol: example.com/cases/lib.Each
    pure: true
    calls: [{fn: arg1, with: [arg0]}]
  - symbol: example.com/cases/lib.Later
    pure: true
    calls: [{fn: arg0, mode: go}]
  # a call that moves data to or from the data store (testdata/go/cases/dbsrc)
  - symbol: example.com/cases/lib.StoreRead
    pure: true
    boundary: stored_data
